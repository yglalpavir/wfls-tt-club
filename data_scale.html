    <style>
        .ds-hero-meta { margin-top:16px; font-size:.84rem; color:rgba(255,255,255,.72); font-family:var(--font-en); }
        .ds-sep { margin:0 10px; opacity:.5; }
        .ds-section { margin-bottom:40px; }
        .ds-section-head { margin-bottom:16px; }
        .ds-section-head h2 { margin:0 0 6px; font-size:1.35rem; font-weight:800; color:var(--text-primary); }
        .ds-section-head p { margin:0; font-size:.86rem; color:var(--text-secondary); }
        .ds-lead { margin:0 0 14px; font-size:.92rem; color:var(--text-secondary); line-height:1.7; }
        .ds-note { margin:12px 0 0; font-size:.82rem; color:var(--text-muted); }
        .ds-kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:18px; }
        .ds-kpi { padding:16px 18px; display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
        .ds-kpi i { font-size:1.3rem; color:var(--accent-blue,#3b82f6); width:42px; height:42px; display:flex; align-items:center; justify-content:center; border-radius:12px; background:rgba(59,130,246,.1); margin-bottom:8px; flex:none; }
        .ds-kpi-value { font-size:1.5rem; font-weight:800; font-family:var(--font-en); color:var(--text-primary); line-height:1.2; }
        .ds-kpi-label { font-size:.78rem; color:var(--text-secondary); }
        .ds-kpi-sub { font-size:.72rem; color:var(--text-muted); font-family:var(--font-en); }
        .ds-tone-blue i { color:var(--accent-blue,#3b82f6); background:rgba(59,130,246,.1); }
        .ds-tone-gold i { color:var(--accent-gold,#f0a500); background:rgba(240,165,0,.12); }
        .ds-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; margin-bottom:18px; }
        .ds-grid-1 { grid-template-columns:1fr; }
        .ds-card { padding:18px 20px; }
        .ds-card h3 { margin:0 0 4px; font-size:1rem; font-weight:700; color:var(--text-primary); }
        .ds-card-desc { font-size:.78rem; color:var(--text-muted); margin:0 0 12px; }
        .ds-chart-box { position:relative; height:280px; margin-top:12px; }
        .ds-bars { display:flex; flex-direction:column; gap:9px; margin-top:12px; }
        .ds-bar-row { display:grid; grid-template-columns:minmax(84px,132px) 1fr auto; align-items:center; gap:10px; }
        .ds-bar-label { font-size:.8rem; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .ds-bar-track { height:9px; border-radius:999px; background:var(--bg-lighter); overflow:hidden; }
        .ds-bar-fill { display:block; height:100%; border-radius:999px; background:var(--accent-blue,#3b82f6); transition:width var(--transition-slow); }
        .ds-fill-gold { background:var(--accent-gold,#f0a500); }
        .ds-fill-green { background:var(--accent-green,#52c41a); }
        .ds-bar-value { font-size:.8rem; font-weight:600; font-family:var(--font-en); color:var(--text-primary); white-space:nowrap; }
        .ds-chip-block { margin-bottom:14px; }
        .ds-chip-block h4 { margin:0 0 8px; font-size:.82rem; font-weight:600; color:var(--text-secondary); }
        .ds-chips { display:flex; flex-wrap:wrap; gap:7px; }
        .ds-chip { display:inline-flex; align-items:center; padding:4px 11px; border-radius:999px; border:1px solid var(--border-color); background:var(--bg-lighter); color:var(--text-secondary); font-size:.76rem; }
        .ds-links { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
        .ds-btn { display:inline-flex; align-items:center; gap:7px; }
        .ds-status { text-align:center; padding:56px 16px; color:var(--text-secondary); }
        .ds-status p { margin:12px 0 0; font-size:.9rem; }
        .ds-spinner { display:block; width:32px; height:32px; margin:0 auto; border:3px solid var(--border-color); border-top-color:var(--accent-blue,#3b82f6); border-radius:50%; animation:dsSpin .8s linear infinite; }
        .ds-status-icon { display:block; width:32px; height:32px; margin:0 auto; border-radius:50%; border:3px solid var(--border-color); border-top-color:transparent; }
        @keyframes dsSpin { to { transform:rotate(360deg); } }
        @media (max-width:640px) { .ds-kpi-row { grid-template-columns:repeat(2,1fr); } .ds-chart-box { height:240px; } .ds-bar-row { grid-template-columns:minmax(64px,1fr) 1fr auto; } }
        @media (prefers-reduced-motion: reduce) { .ds-bar-fill { transition:none; } .ds-spinner { animation:none; } }
        /* ---- 交手网络 ---- */
        .ds-net { display:grid; grid-template-columns:minmax(0,1fr) 210px; gap:22px; align-items:stretch; }
        .ds-net-stage { position:relative; min-width:0; }
        .ds-net-svg { display:block; width:100%; height:auto; animation:dsNetFade .45s ease both; }
        @keyframes dsNetFade { from { opacity:0; } to { opacity:1; } }
        .ds-net-glow { pointer-events:none; }
        .ds-net-g { transition:opacity var(--transition-fast); }
        .ds-net-g:focus { outline:none; }
        .ds-net-svg.is-focus .ds-net-g { opacity:.2; }
        .ds-net-svg.is-focus .ds-net-g.is-hot,
        .ds-net-svg.is-focus .ds-net-g.is-near { opacity:1; }
        .ds-net-ring { fill:none; stroke:var(--accent-blue); stroke-width:1.4; opacity:0; transition:opacity var(--transition-fast); }
        .ds-net-g.is-hot .ds-net-ring, .ds-net-g:focus .ds-net-ring { opacity:.6; }
        .ds-net-node { stroke:var(--bg-white); stroke-width:1.4; }
        .ds-net-c0 { fill:var(--accent-blue); background:var(--accent-blue); }
        .ds-net-c1 { fill:var(--accent-gold); background:var(--accent-gold); }
        .ds-net-c2 { fill:var(--accent-green); background:var(--accent-green); }
        .ds-net-c3 { fill:var(--tag-daily); background:var(--tag-daily); }
        .ds-net-cx { fill:var(--text-muted); background:var(--text-muted); }
        .ds-net-edge { fill:none; stroke:var(--text-secondary); stroke-linecap:round; pointer-events:none; transition:opacity var(--transition-fast), stroke var(--transition-fast); }
        .ds-net-hit { fill:none; stroke:transparent; stroke-width:10; stroke-linecap:round; }
        .ds-net-svg.is-focus .ds-net-edge { opacity:.06; }
        .ds-net-svg.is-focus .ds-net-edge.is-hot { opacity:1; stroke:var(--accent-blue); stroke-opacity:.9 !important; }
        .ds-net-svg.is-focus .ds-net-lab { opacity:.12; }
        .ds-net-svg.is-focus .ds-net-lab.is-near { opacity:1; }
        /* 悬停对象自己的名字由浮层接管，避免同一串字叠在浮层上 */
        .ds-net-svg.is-focus .ds-net-lab.is-self { opacity:0; }
        /* 浮层盖住的名字先让位 */
        .ds-net-svg.is-focus .ds-net-lab.is-under-tip { opacity:0; }
        /* 悬停时临时补出来的名字：进场淡入，且不受压暗影响 */
        .ds-net-svg.is-focus .ds-net-lab.is-hot-lab { opacity:1; animation:dsLabIn .18s ease both; }
        @keyframes dsLabIn { from { opacity:0; } to { opacity:1; } }
        .ds-net-lab { font-family:var(--font-cn); font-size:10.5px; fill:var(--text-secondary); paint-order:stroke; stroke:var(--bg-white); stroke-width:3px; stroke-linejoin:round; pointer-events:none; transition:opacity var(--transition-fast); }
        .ds-net-band { fill:none; stroke:var(--border-color); stroke-dasharray:4 4; }
        .ds-net-band-cap { font-family:var(--font-cn); font-size:11px; font-weight:600; fill:var(--text-muted); letter-spacing:.02em; }
        .ds-net-band-name { font-family:var(--font-cn); font-size:10.5px; fill:var(--text-muted); pointer-events:none; }
        .ds-net-tip { position:absolute; left:0; top:0; z-index:3; display:flex; flex-direction:column; gap:2px; padding:7px 11px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-white); box-shadow:var(--shadow-md); opacity:0; pointer-events:none; white-space:nowrap; transition:opacity var(--transition-fast); }
        .ds-net-tip.is-on { opacity:1; }
        .ds-net-tip b { font-size:.78rem; font-weight:700; color:var(--text-primary); }
        .ds-net-tip span { font-size:.7rem; color:var(--text-muted); font-variant-numeric:tabular-nums; }
        .ds-net-rail { display:flex; flex-direction:column; gap:16px; padding-left:22px; border-left:1px solid var(--border-color); }
        .ds-net-stats { display:grid; grid-template-columns:1fr 1fr; gap:14px 12px; }
        .ds-net-stat { display:flex; flex-direction:column; }
        .ds-net-stat-v { font-family:var(--font-en); font-size:1.45rem; font-weight:700; line-height:1.05; color:var(--text-primary); font-variant-numeric:tabular-nums; }
        .ds-net-stat-l { margin-top:2px; font-size:.72rem; color:var(--text-muted); }
        .ds-net-legend { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
        .ds-net-legend li { display:flex; align-items:center; gap:9px; font-size:.78rem; color:var(--text-secondary); }
        .ds-net-legend em { margin-left:auto; font-style:normal; font-family:var(--font-en); font-size:.76rem; color:var(--text-muted); font-variant-numeric:tabular-nums; }
        .ds-net-swatch { width:10px; height:10px; border-radius:50%; flex:none; }
        .ds-net-keys { display:flex; flex-direction:column; gap:7px; }
        .ds-net-key { display:flex; align-items:center; gap:9px; font-size:.74rem; color:var(--text-muted); }
        .ds-net-key svg { flex:none; stroke:var(--text-muted); }
        .ds-net-dash { width:26px; height:12px; border:1px dashed var(--border-color); border-radius:4px; flex:none; }
        .ds-net-hint { margin:0; font-size:.74rem; line-height:1.6; color:var(--text-muted); }
        @media (max-width:900px) {
            .ds-net { grid-template-columns:1fr; gap:16px; }
            .ds-net-rail { padding-left:0; padding-top:16px; border-left:none; border-top:1px solid var(--border-color); }
            .ds-net-stats { grid-template-columns:repeat(4,1fr); gap:10px; }
        }
        @media (max-width:520px) {
            .ds-net-stats { grid-template-columns:1fr 1fr; }
            .ds-net-stat-v { font-size:1.25rem; }
        }
        @media (prefers-reduced-motion: reduce) { .ds-net-svg { animation:none; } }
    </style>
