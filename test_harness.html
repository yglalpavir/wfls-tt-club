<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="page-hero detail-page-hero"><div class="page-hero-overlay"></div><div class="page-hero-content"><span class="section-tag" id="detailTypeTag">News</span><h1 id="detailTitle">标题</h1><p id="detailDate">日期</p><div id="detailVersion" class="detail-version" style="display:none;"></div></div></section>
<section class="section detail-content-section"><div class="container"><div id="detailDrawsToggle" class="draws-toggle-bar" style="display:none;"></div><div id="detailContent" class="detail-body glass-card"></div><div id="detailDraws" class="detail-draws glass-card" style="display:none;"></div><div id="detailMedia" class="detail-media-grid"></div></div></section>
<div id="DUMP" style="position:fixed;left:-9999px;top:0;white-space:pre;"></div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/common.js"></script>
<script>
(async function () {
    function waitFor(fn, ms) {
        return new Promise(function (resolve, reject) {
            var t0 = Date.now();
            (function chk() { if (fn()) return resolve(); if (Date.now() - t0 > ms) return reject(new Error('timeout')); setTimeout(chk, 50); })();
        });
    }
    try {
        await waitFor(function () { return typeof updateDetailPage === 'function'; }, 5000);
        updateDetailPage().catch(function (e) { document.getElementById('DUMP').textContent += 'updateDetailPage ERROR: ' + e.message + '\n'; });
        await waitFor(function () { return document.getElementById('detailTitle').textContent !== '标题'; }, 8000);
        var vc = document.getElementById('detailVersion');
        var dump = document.getElementById('DUMP');
        dump.textContent += 'title=' + document.getElementById('detailTitle').textContent + '\n';
        dump.textContent += 'versionDisplay=' + vc.style.display + ' | entryCount=' + vc.querySelectorAll('.detail-version-entry').length + '\n';
        var entry = vc.querySelector('.detail-version-entry');
        if (entry) {
            entry.dispatchEvent(new MouseEvent('click', { bubbles: true }));
            await new Promise(function (r) { setTimeout(r, 150); });
            var dd = vc.querySelector('.detail-version-dropdown');
            var isShot = /shot=open/.test(location.search);
            var isMeasure = /measure=1/.test(location.search);
            if (isShot || isMeasure) {
                await new Promise(function (r) { setTimeout(r, 600); });
                if (isMeasure && dd) {
                    var vb2 = dd.querySelector('.detail-version-view');
                    var li = dd.querySelector('li');
                    var list = dd.querySelector('.detail-version-list');
                    var dr = dd.getBoundingClientRect(), br = vb2.getBoundingClientRect(), lr = li.getBoundingClientRect();
                    dump.textContent += 'vw=' + innerWidth + '\n';
                    dump.textContent += 'ddRect=' + [dr.left, dr.right, dr.width].join(',') + ' ddClient=' + dd.clientWidth + ' ddScroll=' + dd.scrollWidth + '\n';
                    dump.textContent += 'liRect=' + [lr.left, lr.right, lr.width].join(',') + ' liClient=' + li.clientWidth + ' liScroll=' + li.scrollWidth + '\n';
                    dump.textContent += 'btnRect=' + [br.left, br.right, br.width].join(',') + '\n';
                    dump.textContent += 'btnClippedHoriz=' + (br.right > dr.right || br.left < dr.left || br.width === 0) + '\n';
                    dump.textContent += 'btnOverflowX=' + getComputedStyle(li).overflowX + ' listOverflowX=' + getComputedStyle(list).overflowX + '\n';
                    dump.textContent += 'titleRect=' + (function(){ var t = dd.querySelector('.detail-version-item-title'); var r = t.getBoundingClientRect(); return [r.left, r.right, r.width].join(','); })() + '\n';
                }
                dump.textContent += 'DONE\n';
                return;
            }
            if (dd) {
                dump.textContent += 'dropdownDisplay=' + dd.style.display + ' | liCount=' + dd.querySelectorAll('li').length + '\n';
                dump.textContent += 'viewBtnCount=' + dd.querySelectorAll('.detail-version-view').length + '\n';
                dump.textContent += 'viewBtnTexts=[' + Array.from(dd.querySelectorAll('.detail-version-view')).map(function (b) { return b.textContent; }).join('],[') + ']\n';
                dump.textContent += 'liHtml=' + dd.querySelector('li').outerHTML + '\n';
                var vb = dd.querySelector('.detail-version-view');
                if (vb) {
                    vb.dispatchEvent(new MouseEvent('click', { bubbles: true }));
                    await new Promise(function (r) { setTimeout(r, 400); });
                    dump.textContent += 'AFTER_VIEW title=' + document.getElementById('detailTitle').textContent + '\n';
                    dump.textContent += 'viewingBanner=' + vc.querySelectorAll('.detail-version-viewing').length + ' backBtn=' + (vc.querySelector('.detail-version-back') ? vc.querySelector('.detail-version-back').textContent : 'none') + '\n';
                }
            } else {
                dump.textContent += 'NO DROPDOWN FOUND\n';
            }
        } else {
            dump.textContent += 'NO ENTRY\n';
        }
    } catch (e) {
        document.getElementById('DUMP').textContent += 'ERROR: ' + e.message;
    }
})();
</script>
</body>
</html>
