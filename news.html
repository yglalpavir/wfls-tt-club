<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>近期动态 | WFLS TT Club</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 SheetJS 用于解析 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        /* 专门用于模拟 Excel 界面的样式 */
        .excel-container {
            background-color: #fff;
            border: 1px solid #d4d4d4;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
            margin-top: 20px;
            font-family: 'Calibri', sans-serif;
        }
        
        .excel-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
        }

        .excel-table th, .excel-table td {
            border: 1px solid #c0c0c0;
            padding: 4px 8px;
            min-width: 80px;
            white-space: nowrap;
        }

        /* 表头样式模仿 Excel */
        .excel-table thead tr {
            background-color: #f3f3f3;
            color: #333;
            font-weight: bold;
            text-align: center;
        }

        /* 第一列（通常是序号或名字）加粗 */
        .excel-table td:first-child {
            font-weight: 600;
            background-color: #fafafa;
        }

        /* 鼠标悬停效果 */
        .excel-table tbody tr:hover {
            background-color: #e8f0fe;
            cursor: default;
        }

        .file-upload-note {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">WFLS TT CLUB</div>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="news.html" class="active">近期动态</a></li>
            <li><a href="ranking.html">Ranking (Beta)</a></li>
        </ul>
    </nav>

    <section class="container section-padding">
        <h2 class="section-title">近期赛事与活动记录</h2>
        
        <div class="file-upload-note">
            <i class="fas fa-info-circle"></i> 
            系统正在加载 <code>matches.xlsx</code> 文件数据... 如果未显示，请确保文件已上传至根目录。
        </div>

        <!-- Excel 显示区域 -->
        <div id="excel-wrapper" class="excel-container">
            <table id="excel-data-table" class="excel-table">
                <thead>
                    <tr>
                        <td>加载中...</td>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>请等待数据渲染</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 武汉外国语学校乒乓球社团. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // 页面加载完成后执行 Excel 解析
        document.addEventListener('DOMContentLoaded', function() {
            loadExcel('matches.xlsx');
        });
    </script>
</body>
</html>
