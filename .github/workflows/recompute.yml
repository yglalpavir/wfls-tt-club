name: recompute-api

# 定时（每日北京时间 04:00）+ 数据变更时重算 data/api/ 静态 API 数据。
# 产物由 GitHub Pages 直接对外提供，无需任何服务器；公开仓库 Actions 分钟数免费。

on:
  push:
    branches: [main]
    paths:
      - 'data/score-log.json'
      - 'data/players.json'
      - 'data/seasons.json'
      - 'data/event-coefficient.json'
      - 'data/decay-config.json'
      - 'js/score-engine.js'
      - 'js/common.js'
      - 'js/ranking.js'
      - 'tools/recompute_rankings.js'
      - '.github/workflows/recompute.yml'
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 = 北京时间（Asia/Shanghai）次日 04:00
  workflow_dispatch:

concurrency:
  group: recompute-api
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    env:
      # runner 默认 UTC；getTodayStr / calculateRealtimeRanking 用本地日期，
      # 不设 TZ 会使"实时积分"口径晚 8 小时
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          # 需完整历史才能 push
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recompute data/api
        run: node tools/recompute_rankings.js
      - name: Commit generated API data
        shell: bash
        run: |
          # 只纳入 data/api/，绝不碰其他未提交内容
          git add -A data/api/
          if git diff --cached --quiet; then
            echo "data/api/ 无变化，跳过提交"
            exit 0
          fi
          git config user.name "wfls-api-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "api: recompute $(TZ=Asia/Shanghai date +%F)"
          git push origin HEAD:main
          # 注意：不要在此处重跑 tools/generate_meta.py —— 它的 sitemap lastmod
          # 取自 HEAD 提交日期，每次 commit 都会翻转，会让 ci.yml 转红。
