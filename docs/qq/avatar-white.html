<!DOCTYPE html>
<!-- QQ avatar (light alternative): white field + the club mark in brand blue.
     Same geometry and rules as avatar-blue.html. Use it if the account needs a
     light avatar, but note it can look washed out in a white comment list. -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>QQ 头像 · 白底</title>
<style>
  html, body { margin: 0; padding: 0; }
  .avatar { position: relative; width: 640px; height: 640px; background: #ffffff; overflow: hidden; }
  .avatar img { position: absolute; left: 50%; top: 50%; width: 76%;
                transform: translate(-50%, -50%); display: block; }
</style>
</head>
<body>
  <div class="avatar"><img src="logo-mark-blue.svg" alt="武外乒乓球社团徽标"></div>
</body>
</html>
