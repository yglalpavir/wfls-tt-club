<!DOCTYPE html>
<!-- QQ avatar: flat brand-blue field + the club mark + the short wordmark "WTTC".
     640x640 canvas, exported at --force-device-scale-factor=2 -> 1280x1280.
     Why a short wordmark is defensible here (see README section 1):
       - Apple HIG forbids decorative text in icons but allows a mnemonic: "displaying
         a mnemonic like the first letter of your app's name can help people recognize
         your app". WTTC is that mnemonic in its longest useful form: four Latin caps.
       - A 7-character Chinese name cannot survive the 24-40px sizes (see
         avatar-with-name.html); 4 wide-tracked Latin caps still read at 40px.
     Layout: mark at 68% of the canvas, caption 25px below, the whole lockup centred,
     every corner inside a circle of radius 0.5 x 640 with >10% clearance (measured:
     the mark's top corners reach a radius of 0.45 x 640).
     No shadow, no rounded corners (the platform draws its own mask). -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>QQ 头像 · 蓝底 + WTTC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  .avatar { display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 640px; height: 640px; background: #2f7fe6; overflow: hidden; }
  .avatar .mark { display: block; width: 68%; }
  .avatar .word { margin-top: 25px; color: #ffffff;
                  font-family: "Poppins", "Noto Sans SC", sans-serif; font-weight: 800;
                  font-size: 111px; line-height: 0.75;
                  letter-spacing: 0.03em; text-indent: 0.03em; }
</style>
</head>
<body>
  <div class="avatar">
    <img class="mark" src="logo-mark-white.svg" alt="武外乒乓球社团徽标">
    <div class="word">WTTC</div>
  </div>
</body>
</html>
