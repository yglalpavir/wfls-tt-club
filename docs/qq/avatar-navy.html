<!DOCTYPE html>
<!-- QQ avatar (alternative field): near-black navy + the club mark in white.
     Same geometry and rules as avatar-blue.html; only the field colour differs,
     for the strongest contrast at 24-40px. -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>QQ 头像 · 墨底</title>
<style>
  html, body { margin: 0; padding: 0; }
  .avatar { position: relative; width: 640px; height: 640px; background: #101828; overflow: hidden; }
  .avatar img { position: absolute; left: 50%; top: 50%; width: 76%;
                transform: translate(-50%, -50%); display: block; }
</style>
</head>
<body>
  <div class="avatar"><img src="logo-mark-white.svg" alt="武外乒乓球社团徽标"></div>
</body>
</html>
