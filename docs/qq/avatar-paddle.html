<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>QQ 头像 B · 球拍标</title>
<!--
  QQ 号「武外乒乓球社团」头像 · 方案 B（图形标）
  640×640 正方形，纯图形（球拍 + 小球 + 击球弧线），40px 缩略图下也能认；主体收在内切圆内，方/圆两种裁切都不丢
  图形与站徽标 Assets/files/logo.svg 同源语言（白描线 + 小球 + 弧线），但去掉文字以便小尺寸阅读
  导出：Chrome 无头 --window-size=640,640 --force-device-scale-factor=2 --virtual-time-budget=20000
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 640px; height: 640px; overflow: hidden; }
  body { background: #2467c9; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .av {
    position: relative; width: 640px; height: 640px; overflow: hidden;
    background: radial-gradient(118% 118% at 26% 16%, #74bcff 0%, #3f8bf0 46%, #2467c9 100%);
  }
  .hatch { position: absolute; inset: -120px; opacity: .15; pointer-events: none; }
  .hatch i { position: absolute; left: 0; right: 0; height: 2px; background: #fff; transform: rotate(-24deg); }
  .hatch i:nth-child(1) { top: 150px; }
  .hatch i:nth-child(2) { top: 268px; }
  .hatch i:nth-child(3) { top: 386px; }
  .hatch i:nth-child(4) { top: 504px; }

  svg.mark { position: absolute; inset: 0; width: 640px; height: 640px; }

  .en {
    position: absolute; left: 0; right: 0; bottom: 62px; text-align: center;
    font-family: 'Poppins', sans-serif; font-weight: 800;
    font-size: 25px; letter-spacing: 8px; color: rgba(255, 255, 255, .8);
  }
</style>
</head>
<body>
<div class="av">
  <div class="hatch"><i></i><i></i><i></i><i></i></div>

  <svg class="mark" viewBox="0 0 640 640">
    <defs>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0a2d64" flood-opacity=".30"/>
      </filter>
    </defs>

    <!-- 球拍整体（胶皮面 + 拍颈 + 拍柄），绕 (300,300) 左倾 -22°
     胶皮用经典红胶 + 黑边黑柄：白色拍面加一根直杆在缩略图里会被读成放大镜，红胶/黑柄才是一眼认得出的乒乓拍 -->
    <g filter="url(#sh)" transform="rotate(-22 300 300)">
      <!-- 拍柄：细长，末端燕尾外张 -->
      <path d="M272 318 L328 318 L337 456 C339 474 324 484 300 484
               C276 484 261 474 263 456 Z" fill="#101018"/>
      <!-- 拍颈 -->
      <path d="M268 288 L332 288 L329 322 L271 322 Z" fill="#101018"/>
      <!-- 胶皮面：宽大于高的蛋形，底缘平直过渡到拍颈 -->
      <path d="M300 130 C363 130 413 172 413 226 C413 272 388 298 352 302
               L248 302 C212 298 187 272 187 226 C187 172 237 130 300 130 Z"
            fill="#ef4136" stroke="#101018" stroke-width="6"/>
      <!-- 胶皮高光 -->
      <path d="M236 208 C250 174 278 154 310 152" fill="none" stroke="#fff"
            stroke-width="9" stroke-linecap="round" opacity=".45"/>
    </g>

    <!-- 运动弧线：从拍面甩向小球，只做一小段，不喧宾夺主 -->
    <path d="M372 356 C404 344 428 320 440 288" fill="none" stroke="#fff"
          stroke-width="12" stroke-linecap="round" opacity=".5"/>

    <!-- 小球 -->
    <circle cx="474" cy="240" r="44" fill="#fff" filter="url(#sh)"/>
  </svg>

  <div class="en">WFLS TT CLUB</div>
</div>
</body>
</html>
