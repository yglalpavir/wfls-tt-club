<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>QQ 头像 A · 乒字标</title>
<!--
  QQ 号「武外乒乓球社团」头像 · 方案 A（字标）
  640×640 正方形，主体内容全部收在内切圆（r=320）内 —— QQ 列表是圆角方、资料卡/群资料是圆形，同一张图两处都不裁到主体
  品牌蓝径向渐变（#4DA3FF 系，站 --primary-light / --primary-dark），白字，Noto Serif SC 900（沿用海报房规：中文主标题不用站酷庆科黄油体）
  导出：Chrome 无头 --window-size=640,640 --force-device-scale-factor=2 --virtual-time-budget=20000
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 640px; height: 640px; overflow: hidden; }
  body { background: #2467c9; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .av {
    position: relative; width: 640px; height: 640px; overflow: hidden;
    background:
      radial-gradient(118% 118% at 26% 16%, #74bcff 0%, #3f8bf0 46%, #2467c9 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  /* 底层斜向细线，只做肌理，不参与识别 */
  .hatch { position: absolute; inset: -120px; opacity: .16; pointer-events: none; }
  .hatch i { position: absolute; left: 0; right: 0; height: 2px; background: #fff; transform: rotate(-24deg); }
  .hatch i:nth-child(1) { top: 150px; }
  .hatch i:nth-child(2) { top: 268px; }
  .hatch i:nth-child(3) { top: 386px; }
  .hatch i:nth-child(4) { top: 504px; }

  .glyph {
    position: relative; z-index: 2; margin-top: -34px;
    font-family: 'Noto Serif SC', serif; font-weight: 900;
    font-size: 430px; line-height: 1; color: #fff;
    text-shadow: 0 10px 34px rgba(10, 45, 100, .28);
  }

  /* 小球 + 击球弧线 */
  .ball { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

  .en {
    position: relative; z-index: 2; margin-top: 26px;
    font-family: 'Poppins', sans-serif; font-weight: 800;
    font-size: 27px; letter-spacing: 9px; color: rgba(255, 255, 255, .88);
  }
  .cn {
    position: relative; z-index: 2; margin-top: 12px;
    font-family: 'Noto Serif SC', serif; font-weight: 700;
    font-size: 25px; letter-spacing: 7px; color: rgba(255, 255, 255, .62);
  }
</style>
</head>
<body>
<div class="av">
  <div class="hatch"><i></i><i></i><i></i><i></i></div>

  <div class="glyph">乒</div>

  <svg class="ball" viewBox="0 0 640 640" width="640" height="640">
    <path d="M168 452 C232 396 296 336 386 268" fill="none" stroke="#fff" stroke-width="9"
          stroke-linecap="round" opacity=".55"/>
    <circle cx="430" cy="216" r="40" fill="#fff"/>
  </svg>

  <div class="en">WFLS TT CLUB</div>
  <div class="cn">武外乒乓球社团</div>
</div>
</body>
</html>
