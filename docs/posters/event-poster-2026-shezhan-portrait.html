<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>社展 · 10.8 宣传海报（竖版） | 武汉外国语学校乒乓球社团</title>
<!--
  社展竖版海报（1240×1754，A4 @150dpi 比例）· 回到 event-poster-2026-shierqiang-bold-portrait.html「大字版」骨架
  结构：英文名行 → 巨字「社展」+ 社团徽标 → 社团行 → 黑底横幅（日期+下午 / 地点）→ 超大主张 + 收尾口号 → 页脚
  页脚参照 event-poster-2026-shierqiang-portrait.html：230px 白底二维码牌 + 四行文字堆（标题 / 说明 / 官网 / 短网址+群号）+ 居中署名行，无竖线、无右浮落款
  层级只用字号断崖建立：380 / 150 / 88 / 84 / 64 / 58 / 50 / 46 / 36 / 21 / 20 / 19
  配色：纯黑白 + 冷灰蓝细线（--line #d8e2ee），沿用大字版；不使用彩色
  字体分工：Poppins=英文/数字 · Noto Serif SC=中文主标题 · Noto Sans SC=正文/页脚 · IBM Plex Mono=英文小字
  注：巨字曾试过站酷庆科黄油体（ZCOOL QingKe HuangYou），社长判定太丑——本社团海报中文标题统一用 Noto Serif SC，不要再换
  导出：Chrome 无头 --force-device-scale-factor=3 --window-size=1240,1754 --virtual-time-budget=20000 --screenshot=...
  二维码读取 ../../Assets/images/qr-code.jpg（相对 docs/posters/），缺失时显示占位框；印刷前确认为最新群码。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
      --ink: #101018; --ink2: #3a4250; --muted: #6b7c93;
      --line: #d8e2ee; --dim: #9fb2c6;
      --en: 'Poppins', sans-serif; --cn: 'Noto Sans SC', sans-serif; --serif: 'Noto Serif SC', serif;
      --mono: 'IBM Plex Mono', monospace;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--cn); color: var(--ink); background: #e3e9f1; }

  .poster {
    position: relative; width: 1240px; height: 1754px; overflow: hidden; background: #fff;
    padding: 36px 56px 0; display: flex; flex-direction: column;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  /* 顶部英文名行 */
  .meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 13px; letter-spacing: 2.5px; color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 500; }

  /* 标题行：巨字「社展」 + 社团徽标 */
  .trow { display: flex; align-items: flex-end; gap: 20px; }
  .t1 { margin-top: 18px; font-family: var(--serif); font-size: 380px; font-weight: 900; line-height: 1.02; color: var(--ink); white-space: nowrap; }
  .tright { flex: 1; display: flex; justify-content: flex-end; align-items: flex-end; }
  .logo { display: block; height: 288px; width: auto; }

  /* 社团行 */
  .t3 { margin-top: 30px; display: flex; align-items: center; gap: 24px; }
  .t3 .lab { font-family: var(--serif); font-size: 50px; font-weight: 700; letter-spacing: 5px; color: var(--ink2); white-space: nowrap; }
  .t3 .lab b { font-family: var(--en); font-weight: 800; color: var(--ink); }
  .t3 .rule { flex: 1; height: 3px; background: var(--ink); }

  /* 黑底横幅：时间 + 地点（全页唯一实心块） */
  .banner { margin-top: 44px; background: var(--ink); color: #fff; border-radius: 22px; padding: 34px 44px 36px; }
  .banner .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 26px; }
  .banner .date { font-family: var(--en); font-size: 88px; font-weight: 900; letter-spacing: 2px; line-height: 1; }
  .banner .time { font-family: var(--serif); font-size: 84px; font-weight: 700; letter-spacing: 8px; line-height: 1; }
  .banner .row2 { margin-top: 18px; display: flex; align-items: center; gap: 20px; }
  .banner .lab { font-family: var(--en); font-size: 20px; font-weight: 700; letter-spacing: 3px; color: var(--dim); }
  .banner .ven { font-family: var(--serif); font-size: 58px; font-weight: 700; letter-spacing: 3px; line-height: 1; }

  /* 主张：全页第二重心 */
  .say { margin-top: 88px; }
  .say .ft { font-family: var(--serif); font-size: 136px; font-weight: 900; letter-spacing: 4px; line-height: 1.1; color: var(--ink); }
  .say .closing { margin-top: 56px; font-family: var(--serif); font-size: 64px; font-weight: 900; letter-spacing: 2px; line-height: 1.3; color: var(--ink); }

  /* 页脚：参照 event-poster-2026-shierqiang-portrait.html —— 白底二维码牌 + 三行文字堆，无竖线无右浮落款 */
  .foot { margin: auto 0 0; padding: 40px 0 14px; }
  .join { display: flex; align-items: center; gap: 40px; }
  .qr-box {
    flex: 0 0 230px; height: 230px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.14);
  }
  .qr-box img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .qr-fallback { display: none; width: 100%; height: 100%; border: 2px dashed #b9c6d6; border-radius: 8px; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 11px; color: var(--muted); line-height: 1.5; }
  .join-info { flex: 1; }
  .join-info .t { font-size: 36px; font-weight: 900; letter-spacing: 2px; color: var(--ink); }
  .join-info .s { margin-top: 10px; font-size: 20px; color: var(--ink2); line-height: 1.7; }
  .join-info .url { margin-top: 10px; font-size: 21px; color: var(--muted); letter-spacing: 0.3px; }
  .join-info .gnum { margin-top: 6px; font-size: 21px; color: var(--ink); }
  .join-info .gnum .lnk { color: var(--muted); }
  .join-info .gnum b { font-family: var(--en); font-weight: 800; font-size: 46px; color: var(--ink); letter-spacing: 1px; margin-left: 12px; }
  .copy { margin-top: 16px; text-align: center; font-size: 19px; letter-spacing: 2px; color: #a6b4c6; }

  @media print {
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<div class="poster">

  <div class="meta">
    <span>WFLS TABLE TENNIS CLUB</span>
    <span>WUHAN FOREIGN LANGUAGES SCHOOL</span>
  </div>

  <div class="trow">
    <div class="t1">社展</div>
    <div class="tright"><img class="logo" src="../../Assets/files/logo.svg" alt="武外乒乓球社团徽标"></div>
  </div>
  <div class="t3"><span class="lab">武汉外国语学校乒乓球社团 <b>2026</b> 秋季</span><span class="rule"></span></div>

  <div class="banner">
    <div class="row1"><span class="date">10.8 THU</span><span class="time">下午</span></div>
    <div class="row2"><span class="lab">VENUE</span><span class="ven">升旗台旁边</span></div>
  </div>

  <div class="say">
    <div class="ft">社长说：参与活动<br>有机会拿奖品</div>
    <div class="closing">欢迎大家活跃参加乒乓球社社展</div>
  </div>

  <div class="foot">
    <div class="join">
      <div class="qr-box">
        <img class="qr" src="../../Assets/images/qr-code.jpg" alt="社团QQ群二维码">
        <div class="qr-fallback">二维码占位</div>
      </div>
      <div class="join-info">
        <div class="t">扫码进群</div>
        <div class="s">社团活动通知、积分排名与对阵表在官网实时更新，欢迎进群围观交流</div>
        <div class="url">官网 yglalpavir.github.io/wfls-tt-club</div>
        <div class="gnum"><span class="lnk">https://bit.ly/wfls-tt-club</span>　群号<b>760667083</b></div>
      </div>
    </div>
    <div class="copy">武汉外国语学校乒乓球社团 · 2026 年 10 月 8 日</div>
  </div>

</div>
<script>
  document.querySelectorAll('img.qr').forEach(function (im) {
    im.onerror = function () {
      im.style.display = 'none';
      var f = im.parentElement.querySelector('.qr-fallback');
      if (f) f.style.display = 'flex';
    };
  });
</script>
</body>
</html>
