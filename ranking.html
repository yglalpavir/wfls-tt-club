<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/svg+xml" href="Assets/files/favicon_4DA3FF.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>(function(){try{var t=localStorage.getItem("wfls-tt-theme");var d=t==="dark"||(!t&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.classList.add("dark-mode");}catch(e){}})()</script>
    <meta name="description" content="WFLS 乒乓球社团积分排名系统。基于 ELO 变体算法自动计算，支持多时间节点对比。">
    <meta name="keywords" content="武汉外国语学校,WFLS,乒乓球,积分排名,ELO,排名系统">
    <meta name="author" content="WFLS Table Tennis Club">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Ranking Beta | WFLS Table Tennis Club">
    <meta property="og:description" content="WFLS 乒乓球社团积分排名系统。基于 ELO 变体算法自动计算，支持多时间节点对比。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://yglalpavir.github.io/wfls-tt-club/Assets/images/og-cover.png">
    <meta name="twitter:image" content="https://yglalpavir.github.io/wfls-tt-club/Assets/images/og-cover.png">
    <meta property="og:url" content="https://yglalpavir.github.io/wfls-tt-club/ranking.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ranking Beta | WFLS Table Tennis Club">
    <meta name="twitter:description" content="WFLS 乒乓球社团积分排名系统。基于 ELO 变体算法自动计算，支持多时间节点对比。">
    <link rel="canonical" href="https://yglalpavir.github.io/wfls-tt-club/ranking.html">
    <title data-i18n="rank_page_title">Ranking Beta | WFLS Table Tennis Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><div style="padding:10px;text-align:center;background:#b91c1c;color:#fff;font-size:0.9rem;">本站需要启用 JavaScript 才能加载排名与内容数据。This site requires JavaScript to load data.</div></noscript>
    <script src="js/shared-partials.js" data-partial="nav"></script>

    <section class="page-hero ranking-page-hero">
        <div class="page-hero-overlay"></div>
        <div class="page-hero-content">
            <span class="section-tag beta-tag-large">Beta Version</span>
            <h1>Ranking</h1>
            <p data-i18n="rank_hero_desc">社团积分排名系统 · 支持多时间节点对比 · 点击姓名查看积分明细</p>
        </div>
    </section>

    <section class="section ranking-main-section">
        <div class="container">
            <div class="ranking-layout">
                <aside class="ranking-sidebar glass-card" id="rankingSidebar">
                    <h2 class="sidebar-title" data-i18n="rank_sidebar_title">时间节点</h2>
                    <ul class="time-node-list" id="timeNodeList">
                        <!-- JS动态渲染 -->
                    </ul>
                </aside>
                
                <div class="ranking-content">
                    <div class="section-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:24px;">
                        <div>
                            <span class="section-tag" data-i18n="rank_tag">Data Table</span>
                            <h2 class="section-title" data-i18n="rank_title">积分数据表</h2>
                        </div>
                        <a href="detail.html?type=qa&id=q1" class="qa-link-btn" aria-label="Ranking scoring rules">
                            <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
                            <span data-i18n="rank_qa_btn">积分计算规则</span>
                        </a>
                    </div>
                    
                    <div class="ranking-controls">
                        <span class="sort-hint"><span data-i18n="rank_sort_hint">当前排序：</span><strong id="sortIndicator">积分降序</strong></span>
                        <span class="update-info" id="currentTimeLabel">加载中...</span>
                        <button type="button" class="table-export-btn" id="exportRankBtn"><i class="fa-solid fa-image"></i><span data-i18n="rank_export_btn">导出图片</span></button>
                        <div class="mobile-sort-bar">
                            <select class="mobile-sort-select" id="mobileSortSelect" aria-label="排序字段"></select>
                            <button type="button" class="mobile-sort-dir" id="mobileSortDir" aria-label="切换升序/降序">&#9660;</button>
                        </div>
                    </div>
                    
                    <div class="ranking-full-table-wrapper glass-card">
                        <table class="ranking-table ranking-table-full" id="rankingFullTable">
                            <thead>
                                <tr>
                                    <th data-sort="rank" class="sortable" style="width:50px;"># <span class="sort-arrow"></span></th>
                                    <th data-sort="姓名" class="sortable">姓名 <span class="sort-arrow"></span></th>
                                    <th data-sort="当前积分" class="sortable active-sort">当前积分 <span class="sort-arrow">&#9660;</span></th>
                                    <th data-sort="积分变化" class="sortable" style="width:80px;">积分变化 <span class="sort-arrow"></span></th>
                                    <th data-sort="变化" style="width:80px;">排名变化</th>
                                    <th data-sort="总场次" class="sortable">总场次 <span class="sort-arrow"></span></th>
                                    <th data-sort="胜率" class="sortable">胜率 <span class="sort-arrow"></span></th>
                                </tr>
                            </thead>
                            <tbody id="rankingFullBody">
                                <tr><td colspan="7" style="text-align:center;padding:40px;">加载排名数据中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 积分明细模态框 -->
    <div class="modal-overlay" id="scoreDetailModal">
        <div class="modal-content score-detail-modal glass-card">
            <button class="modal-close" id="scoreDetailClose">&times;</button>
            <h3 id="scoreDetailTitle">积分明细</h3>
            <div class="score-detail-table-wrapper">
                <table class="score-detail-table">
                    <thead>
                        <tr>
                            <th data-i18n="score_col_date">日期</th>
                            <th data-i18n="score_col_type">类型</th>
                            <th data-i18n="score_col_opponent">对手</th>
                            <th data-i18n="score_col_result">结果</th>
                            <th data-i18n="score_col_score_before">赛前积分</th>
                            <th data-i18n="score_col_change">积分变动</th>
                            <th data-i18n="score_col_score_after">赛后积分</th>
                        </tr>
                    </thead>
                    <tbody id="scoreDetailBody">
                        <!-- JS动态渲染 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 🥚 WTT 彩蛋入口 -->
    <div class="wtt-easter-egg-section" id="wttEasterEgg">
        <div class="container">
            <div class="wtt-easter-egg-card glass-card">
                <div class="wtt-egg-visual">
                    <div class="wtt-egg-icon-ring">
                        <i class="fa-solid fa-table-tennis-paddle-ball wtt-egg-icon" aria-hidden="true"></i>
                    </div>
                    <span class="wtt-egg-badge">Easter Egg</span>
                </div>
                <div class="wtt-egg-body">
                    <h3 class="wtt-egg-title">你发现了一个彩蛋</h3>
                    <p class="wtt-egg-desc">基于武外乒乓球社积分规则的 WTT排名</p>
                </div>
                <a href="wtt_hub.html" class="btn wtt-egg-btn">
                    <span>进入查看</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>

    <script src="js/shared-partials.js" data-partial="footer"></script>

    <script src="js/shared-partials.js" data-partial="qr-modal"></script>

    <script src="js/common.js"></script>
    <script src="js/score-engine.js"></script>
    <script src="js/ranking.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
