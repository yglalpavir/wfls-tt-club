  - generic [ref=f8e156]:
    - generic [ref=f8e157]:
      - generic [ref=f8e158]: Philosophy
      - heading "社团理念" [level=2] [ref=f8e159]
      - paragraph [ref=f8e160]: 我们的核心价值观与指导思想
    - generic [ref=f8e163]:
      - paragraph [ref=f8e164]: “乒”搏无悔，挥拍逐梦；以球会友，以技强身。
      - paragraph [ref=f8e165]: 我社秉持“健康第一，快乐为本”的宗旨，致力于为同学们打造一个释放压力、展现自我的活力平台。
      - paragraph [ref=f8e166]: 在这里，你可以精进技术，从曾经的“菜鸟”一步步成长为球场上的“大神”；你可以收获友谊，找到属于自己的乒乓搭档，共享赛场欢笑；你还可以磨炼心性，学会在逆境中反击，在起伏中成长。让我们一同拿起球拍，在清脆的击球声中，书写属于我们的旋转青春！
  - generic [ref=f8e168]:
    - generic [ref=f8e169]:
      - generic [ref=f8e170]: Activities
      - heading "社团活动" [level=2] [ref=f8e171]
      - paragraph [ref=f8e172]: 全年性活动、社团课活动及年度大赛
    - generic [ref=f8e175]:
      - paragraph [ref=f8e176]: 【全年性活动】个人分制度：参加官方认可的比赛，为自己“乒”得高分，展现自我，拥有官方认证的乒乓球球技排名。友谊赛（可入积分）：随时拉上好友来一场比赛，邀请干部观赛或赛后向管理层报比分得到认证，即可获得个人分。
      - paragraph [ref=f8e177]: 【社团课活动】排位赛：官方赛事。校队联赛：官方赛事，旨在磨砺并保持校队成员的技术与状态。
      - paragraph [ref=f8e178]: 【每年一届的大赛】校乒赛团体赛：每年3–4月举办，3–4人一队，展现团队风采。校乒赛单打赛：每年4–6月举办，所有学生均可报名，展现个人魅力。
