<body>
<noscript><div style="padding:10px;text-align:center;background:#b91c1c;color:#fff;font-size:0.9rem;">本站需要启用 JavaScript 才能加载排名与内容数据。This site requires JavaScript to load data.</div></noscript>
    <script src="js/shared-partials.js" data-partial="nav"></script>

    <section class="page-hero">
        <div class="page-hero-overlay"></div>
        <div class="page-hero-content">
            <span class="section-tag" data-i18n="personal_stats_tag">Personal Stats</span>
            <h1 data-i18n="personal_stats_title">个人数据</h1>
            <p data-i18n="personal_stats_desc">个人比赛数据统计</p>
        </div>
    </section>

    <section class="section personal-stats-main-section">
        <div class="container">
            <div class="viz-section-header">
                <span class="section-tag">Personal Stats</span>
                <h2 class="section-title" data-i18n="personal_stats_title">个人数据</h2>
            </div>
            <div class="viz-personal-grid">
                <div class="viz-personal-selector glass-card">
                    <div class="tag-filter-section" id="tagFilterSection">
                        <label style="font-size:0.8rem;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:8px;"><i class="fa-solid fa-tags"></i> <span data-i18n="personal_stats_filter_label">按标签筛选</span></label>
                        <div class="tag-filter-list" id="tagFilterList">
                            <!-- JS 动态渲染 -->
                        </div>
                    </div>
                    <div class="compare-selector-group" style="margin-top:16px;">
                        <label data-i18n="personal_stats_search_label">搜索球员</label>
                        <div class="player-search-wrapper">
                            <i class="fa-solid fa-magnifying-glass player-search-icon"></i>
                            <input type="text" class="player-search-input" id="playerSearchInput" placeholder="搜索球员姓名 / 编号 / 标签（支持拼音）" autocomplete="off">
                        </div>
                    </div>
                </div>
                <div class="viz-personal-result glass-card" id="personalResult">
                    <div class="compare-placeholder">
                        <i class="fa-solid fa-user-chart"></i>
                        <p><span id="playerIndexCount">--</span> <span data-i18n="personal_stats_placeholder">位球员，选择一名查看个人数据页</span></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/shared-partials.js" data-partial="footer"></script>

    <script src="js/shared-partials.js" data-partial="qr-modal"></script>
