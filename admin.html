<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Dashboard | WFLS Table Tennis Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <style>
        :root {
            --dash-bg: #f0f2f5;
            --dash-card: #ffffff;
            --dash-border: #e2e8f0;
            --dash-text: #1a1a2e;
            --dash-text-sec: #4a5568;
            --dash-text-muted: #8899aa;
            --dash-accent: #007bff;
            --dash-accent2: #6f42c1;
            --dash-success: #28a745;
            --dash-warning: #f0a500;
            --dash-danger: #ff4d4f;
            --dash-info: #17a2b8;
            --dash-radius: 16px;
            --dash-radius-sm: 10px;
            --dash-shadow: 0 1px 3px rgba(0,0,0,0.06);
            --dash-shadow-lg: 0 4px 20px rgba(0,0,0,0.08);
            --dash-topbar-h: 60px;
        }
        body.dark-mode {
            --dash-bg: #151821;
            --dash-card: #1f2230;
            --dash-border: #2a2e3d;
            --dash-text: #e4e6ed;
            --dash-text-sec: #aeb4c2;
            --dash-text-muted: #6e7686;
            --dash-shadow: 0 1px 3px rgba(0,0,0,0.3);
            --dash-shadow-lg: 0 4px 20px rgba(0,0,0,0.5);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"Noto Sans SC",sans-serif; background:var(--dash-bg); color:var(--dash-text); min-height:100vh; }
        body.admin-page { overflow:auto; }
        .dash-topbar {
            position:fixed; top:0; left:0; right:0; height:var(--dash-topbar-h);
            background:var(--dash-card); border-bottom:1px solid var(--dash-border);
            display:flex; align-items:center; justify-content:space-between;
            padding:0 28px; z-index:100; box-shadow:var(--dash-shadow);
            backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
        }
        .dash-topbar-left { display:flex; align-items:center; gap:14px; }
        .dash-logo {
            font-family:"Poppins",sans-serif; font-weight:700; font-size:1.1rem;
            color:var(--primary-blue); white-space:nowrap;
            display:flex; align-items:center; gap:8px; text-decoration:none;
        }
        .dash-logo i { font-size:1.3rem; }
        .dash-logo:hover { opacity:0.8; }
        .dash-breadcrumb {
            font-size:0.82rem; color:var(--dash-text-muted);
            padding-left:14px; border-left:1px solid var(--dash-border);
        }
        .dash-topbar-right { display:flex; align-items:center; gap:10px; }
        .dash-btn {
            display:inline-flex; align-items:center; gap:6px;
            padding:8px 16px; border-radius:20px; border:1px solid var(--dash-border);
            background:var(--dash-card); color:var(--dash-text-sec);
            cursor:pointer; font-size:0.82rem; font-weight:500;
            transition:all 0.2s; font-family:"Noto Sans SC",sans-serif;
            white-space:nowrap; text-decoration:none;
        }
        .dash-btn:hover { border-color:var(--primary-blue); color:var(--primary-blue); background:var(--primary-pale); }
        .dash-btn.primary { background:var(--primary-blue); color:#fff; border-color:var(--primary-blue); }
        .dash-btn.primary:hover { background:var(--primary-dark); }
        .dash-main {
            margin-top:var(--dash-topbar-h); padding:24px 28px 40px;
            max-width:1440px; margin-left:auto; margin-right:auto;
        }
        .dash-section-title {
            font-family:"Poppins",sans-serif; font-weight:700; font-size:1.15rem;
            color:var(--dash-text); margin:28px 0 16px;
            display:flex; align-items:center; gap:10px;
        }
        .dash-section-title:first-child { margin-top:0; }
        .dash-section-title i { color:var(--primary-blue); }
        .dash-section-title .badge {
            font-size:0.7rem; font-weight:600; padding:3px 10px; border-radius:12px;
            background:var(--primary-pale); color:var(--primary-blue);
            font-family:"JetBrains Mono",monospace;
        }
        .dash-cards {
            display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
            gap:16px; margin-bottom:8px;
        }
        .dash-card {
            background:var(--dash-card); border-radius:var(--dash-radius);
            padding:20px 24px; box-shadow:var(--dash-shadow);
            border:1px solid var(--dash-border);
            transition:transform 0.2s, box-shadow 0.2s;
            display:flex; flex-direction:column; gap:6px;
            position:relative; overflow:hidden;
        }
        .dash-card:hover { transform:translateY(-2px); box-shadow:var(--dash-shadow-lg); }
        .dash-card .card-icon {
            font-size:2rem; line-height:1;
            width:44px; height:44px; border-radius:12px;
            display:flex; align-items:center; justify-content:center;
            margin-bottom:4px;
        }
        .dash-card .card-label {
            font-size:0.78rem; color:var(--dash-text-muted);
            font-weight:500; text-transform:uppercase; letter-spacing:0.5px;
        }
        .dash-card .card-value {
            font-family:"Poppins",sans-serif; font-weight:800; font-size:2rem;
            color:var(--dash-text); line-height:1.1;
        }
        .dash-card .card-sub {
            font-size:0.75rem; color:var(--dash-text-muted);
            margin-top:2px;
        }
        .dash-card .card-accent-bar {
            position:absolute; top:0; left:0; right:0; height:3px;
            border-radius:var(--dash-radius) var(--dash-radius) 0 0;
        }
        .accent-blue .card-icon { background:rgba(0,123,255,0.1); color:var(--dash-accent); }
        .accent-blue .card-accent-bar { background:var(--dash-accent); }
        .accent-purple .card-icon { background:rgba(111,66,193,0.1); color:var(--dash-accent2); }
        .accent-purple .card-accent-bar { background:var(--dash-accent2); }
        .accent-green .card-icon { background:rgba(40,167,69,0.1); color:var(--dash-success); }
        .accent-green .card-accent-bar { background:var(--dash-success); }
        .accent-warning .card-icon { background:rgba(240,165,0,0.1); color:var(--dash-warning); }
        .accent-warning .card-accent-bar { background:var(--dash-warning); }
        .accent-danger .card-icon { background:rgba(255,77,79,0.1); color:var(--dash-danger); }
        .accent-danger .card-accent-bar { background:var(--dash-danger); }
        .accent-info .card-icon { background:rgba(23,162,184,0.1); color:var(--dash-info); }
        .accent-info .card-accent-bar { background:var(--dash-info); }
        .dash-discipline-grid {
            display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
            gap:14px; margin-bottom:8px;
        }
        .dash-disc-card {
            background:var(--dash-card); border-radius:var(--dash-radius);
            padding:18px 20px; box-shadow:var(--dash-shadow);
            border:1px solid var(--dash-border);
            transition:transform 0.2s; cursor:default;
        }
        .dash-disc-card:hover { transform:translateY(-2px); box-shadow:var(--dash-shadow-lg); }
        .dash-disc-card .disc-header {
            display:flex; align-items:center; gap:10px; margin-bottom:12px;
        }
        .dash-disc-card .disc-icon {
            width:38px; height:38px; border-radius:10px;
            display:flex; align-items:center; justify-content:center;
            font-size:0.9rem; font-weight:700; color:#fff;
            font-family:"Poppins",sans-serif;
        }
        .dash-disc-card .disc-name {
            font-family:"Poppins",sans-serif; font-weight:700; font-size:1rem;
            color:var(--dash-text);
        }
        .dash-disc-card .disc-name small {
            font-weight:400; font-size:0.72rem; color:var(--dash-text-muted);
            display:block;
        }
        .dash-disc-card .disc-stats {
            display:grid; grid-template-columns:1fr 1fr; gap:8px;
        }
        .dash-disc-card .disc-stat {
            text-align:center; padding:8px 6px; border-radius:8px;
            background:var(--dash-bg);
        }
        .dash-disc-card .disc-stat-val {
            font-family:"Poppins",sans-serif; font-weight:700; font-size:1.1rem;
            color:var(--dash-text);
        }
        .dash-disc-card .disc-stat-label {
            font-size:0.68rem; color:var(--dash-text-muted); margin-top:1px;
        }
        .dash-panel {
            background:var(--dash-card); border-radius:var(--dash-radius);
            box-shadow:var(--dash-shadow); border:1px solid var(--dash-border);
            overflow:hidden; margin-bottom:20px;
        }
        .dash-panel-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:14px 22px; border-bottom:1px solid var(--dash-border);
            gap:12px;
        }
        .dash-panel-title {
            font-family:"Poppins",sans-serif; font-weight:700; font-size:0.95rem;
            color:var(--dash-text); display:flex; align-items:center; gap:8px;
        }
        .dash-panel-title i { color:var(--primary-blue); }
        .dash-table-wrap { overflow-x:auto; }
        .dash-table {
            width:100%; border-collapse:collapse; font-size:0.82rem;
        }
        .dash-table thead { background:var(--dash-bg); }
        .dash-table th {
            padding:10px 14px; text-align:left; font-weight:600;
            color:var(--dash-text-sec); font-size:0.76rem; white-space:nowrap;
            border-bottom:1px solid var(--dash-border);
            font-family:"Poppins",sans-serif;
        }
        .dash-table td {
            padding:9px 14px; border-bottom:1px solid var(--dash-border);
            color:var(--dash-text); vertical-align:middle;
        }
        .dash-table tbody tr:hover { background:rgba(0,123,255,0.02); }
        .dash-table .num-cell {
            font-family:"JetBrains Mono",monospace; font-weight:600;
            text-align:right; color:var(--dash-accent);
        }
        .dash-table .mono { font-family:"JetBrains Mono",monospace; font-size:0.8rem; }
        .dash-charts-row {
            display:grid; grid-template-columns:1fr 1fr;
            gap:20px; margin-bottom:20px;
        }
        @media (max-width:900px) { .dash-charts-row { grid-template-columns:1fr; } }
        .dash-chart-box {
            background:var(--dash-card); border-radius:var(--dash-radius);
            box-shadow:var(--dash-shadow); border:1px solid var(--dash-border);
            padding:16px 20px;
        }
        .dash-chart-box canvas { max-height:300px; }
        .dash-loading {
            text-align:center; padding:60px 20px; color:var(--dash-text-muted);
        }
        .dash-loading .spinner {
            display:inline-block; width:40px; height:40px; border:3px solid var(--dash-border);
            border-top-color:var(--primary-blue); border-radius:50%;
            animation:spin 0.8s linear infinite; margin-bottom:16px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .dash-empty {
            text-align:center; padding:32px; color:var(--dash-text-muted);
            font-size:0.85rem;
        }
        .dash-updated {
            text-align:right; font-size:0.72rem; color:var(--dash-text-muted);
            margin-bottom:20px;
        }
        @media (max-width:768px) {
            .dash-main { padding:16px 12px 24px; }
            .dash-cards { grid-template-columns:repeat(2,1fr); }
            .dash-discipline-grid { grid-template-columns:1fr; }
            .dash-card .card-value { font-size:1.5rem; }
            .dash-breadcrumb { display:none; }
        }
    </style>
</head>
<body class="admin-page">
    <div class="dash-topbar">
        <div class="dash-topbar-left">
            <a href="index.html" class="dash-logo">
                <i class="fa-solid fa-table-tennis-paddle-ball"></i> WFLS Admin
            </a>
            <span class="dash-breadcrumb">/ 数据仪表盘</span>
        </div>
        <div class="dash-topbar-right">
            <button class="dash-btn" id="themeToggle" title="切换主题">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="dash-btn primary" id="refreshBtn">
                <i class="fa-solid fa-rotate"></i> 刷新数据
            </button>
            <a href="index.html" class="dash-btn">
                <i class="fa-solid fa-arrow-left"></i> 返回首页
            </a>
        </div>
    </div>
    <div class="dash-main" id="dashMain">
        <div class="dash-loading" id="loadingView">
            <div class="spinner"></div>
            <p>正在加载数据...</p>
        </div>
        <div id="dashboardContent" style="display:none;"></div>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
