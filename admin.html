<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>(function(){try{var t=localStorage.getItem("wfls-tt-theme");var d=t==="dark"||(!t&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.classList.add("dark-mode");}catch(e){}})()</script>
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Dashboard | WFLS Table Tennis Club</title>
    <link rel="icon" type="image/svg+xml" href="Assets/files/favicon_4DA3FF.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous" defer></script>
    <style>
        /* ========================================
           Admin Dashboard 设计系统
           ======================================== */
        :root {
            --dash-bg: #f4f6fa;
            --dash-bg-deep: #e9edf4;
            --dash-card: #ffffff;
            --dash-card-2: #f8fafc;
            --dash-border: #e5eaf1;
            --dash-text: #16213a;
            --dash-text-sec: #48566d;
            --dash-text-muted: #8a97ab;
            --dash-accent: #007bff;
            --dash-accent2: #6f42c1;
            --dash-success: #16a34a;
            --dash-warning: #f0a500;
            --dash-danger: #ef4444;
            --dash-info: #0ea5b7;
            --dash-radius: 18px;
            --dash-radius-sm: 12px;
            --dash-shadow-sm: 0 1px 2px rgba(22,33,58,0.05);
            --dash-shadow: 0 1px 3px rgba(22,33,58,0.05), 0 6px 20px -6px rgba(22,33,58,0.08);
            --dash-shadow-lg: 0 4px 12px rgba(22,33,58,0.07), 0 18px 44px -12px rgba(22,33,58,0.16);
        }
        body.dark-mode {
            --dash-bg: #10131c;
            --dash-bg-deep: #171b27;
            --dash-card: #191e2b;
            --dash-card-2: #1f2534;
            --dash-border: #262e41;
            --dash-text: #e6e9f2;
            --dash-text-sec: #aab3c5;
            --dash-text-muted: #67718a;
            --dash-success: #34d399;
            --dash-warning: #fbbf24;
            --dash-danger: #f87171;
            --dash-info: #22d3ee;
            --dash-shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
            --dash-shadow: 0 1px 3px rgba(0,0,0,0.35), 0 6px 20px -6px rgba(0,0,0,0.35);
            --dash-shadow-lg: 0 4px 12px rgba(0,0,0,0.4), 0 18px 44px -12px rgba(0,0,0,0.55);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"Noto Sans SC",sans-serif; background:var(--dash-bg); color:var(--dash-text); min-height:100vh; }
        body.admin-page { overflow:auto; background:
            radial-gradient(1100px 480px at 85% -180px, rgba(0,123,255,0.08), transparent 60%),
            radial-gradient(900px 420px at -10% -160px, rgba(111,66,193,0.07), transparent 60%),
            var(--dash-bg);
        }
        body.dark-mode.admin-page { background:
            radial-gradient(1100px 480px at 85% -180px, rgba(77,163,255,0.10), transparent 60%),
            radial-gradient(900px 420px at -10% -160px, rgba(150,100,255,0.08), transparent 60%),
            var(--dash-bg);
        }

        /* ---------- 页头（非固定，随页面滚动）---------- */
        .page-head {
            display:flex; align-items:center; justify-content:space-between;
            gap:16px; flex-wrap:wrap;
        }
        .page-head-left { display:flex; align-items:center; gap:15px; min-width:0; }
        .logo-badge {
            width:46px; height:46px; border-radius:14px; flex:none;
            display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg, var(--primary-blue), #6f42c1);
            color:#fff; font-size:1.15rem; text-decoration:none;
            box-shadow:0 6px 16px -4px rgba(0,123,255,0.5);
            transition:transform 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        a.logo-badge:hover { transform:translateY(-2px) rotate(-6deg); }
        .ph-titles h1 {
            font-family:"Poppins","Noto Sans SC",sans-serif; font-weight:800; font-size:clamp(1.35rem, 3vw, 1.7rem);
            letter-spacing:-0.02em; line-height:1.25;
            display:flex; align-items:center; gap:10px;
        }
        .h1-dot {
            width:9px; height:9px; border-radius:50%; flex:none;
            background:linear-gradient(135deg, var(--primary-blue), #6f42c1);
            box-shadow:0 0 0 4px rgba(0,123,255,0.14);
        }
        .hero-desc { color:var(--dash-text-muted); font-size:0.84rem; margin-top:3px; }
        .ph-actions { display:flex; align-items:center; gap:9px; }
        .dash-btn {
            display:inline-flex; align-items:center; gap:7px;
            padding:9px 15px; border-radius:11px; border:1px solid var(--dash-border);
            background:var(--dash-card); color:var(--dash-text-sec);
            cursor:pointer; font-size:0.82rem; font-weight:500;
            transition:all 0.2s cubic-bezier(0.4,0,0.2,1); font-family:"Noto Sans SC",sans-serif;
            white-space:nowrap; text-decoration:none;
        }
        .dash-btn:hover { border-color:var(--primary-blue); color:var(--primary-blue); transform:translateY(-1px); box-shadow:0 4px 12px -4px rgba(0,123,255,0.35); }
        .dash-btn.icon-only { padding:9px 11px; }
        .dash-btn.primary {
            background:linear-gradient(135deg, var(--primary-blue), #339dff);
            color:#fff; border-color:transparent;
            box-shadow:0 4px 14px -3px rgba(0,123,255,0.5);
        }
        .dash-btn.primary:hover { filter:brightness(1.06); color:#fff; }
        .dash-btn.primary[disabled] { opacity:0.65; cursor:wait; transform:none; }
        .dash-btn i.spinning { animation:spin 0.9s linear infinite; }

        /* ---------- 主区域 ---------- */
        .dash-main {
            padding:30px clamp(14px, 3vw, 32px) 56px;
            max-width:1480px; margin:0 auto;
        }

        /* ---------- 元信息 chips ---------- */
        .hero-chips { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 6px; min-height:27px; }
        .chip {
            display:inline-flex; align-items:center; gap:7px;
            font-size:0.74rem; color:var(--dash-text-sec);
            background:var(--dash-card); border:1px solid var(--dash-border);
            padding:6px 12px; border-radius:999px; box-shadow:var(--dash-shadow-sm);
            font-family:"JetBrains Mono","Noto Sans SC",monospace;
        }
        .chip i { color:var(--primary-blue); font-size:0.72rem; }
        .chip {
            display:inline-flex; align-items:center; gap:7px;
            font-size:0.74rem; color:var(--dash-text-sec);
            background:var(--dash-card); border:1px solid var(--dash-border);
            padding:6px 12px; border-radius:999px; box-shadow:var(--dash-shadow-sm);
            font-family:"JetBrains Mono","Noto Sans SC",monospace;
        }
        .chip i { color:var(--primary-blue); font-size:0.72rem; }

        /* ---------- 分区标题 ---------- */
        .sec-title {
            font-family:"Poppins","Noto Sans SC",sans-serif; font-weight:700; font-size:1.06rem;
            color:var(--dash-text); margin:34px 0 16px;
            display:flex; align-items:center; gap:11px; letter-spacing:-0.01em;
        }
        .sec-title::before {
            content:""; width:4px; height:18px; border-radius:99px; flex:none;
            background:linear-gradient(180deg, var(--primary-blue), #6f42c1);
        }
        .sec-title:first-child { margin-top:0; }
        .sec-title .badge {
            font-size:0.68rem; font-weight:600; padding:3px 10px; border-radius:999px;
            background:rgba(0,123,255,0.09); color:var(--primary-blue);
            font-family:"JetBrains Mono",monospace;
        }
        .sec-title .sec-sub { font-size:0.76rem; font-weight:400; color:var(--dash-text-muted); margin-left:2px; }

        /* ---------- KPI 卡片 ---------- */
        .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(215px, 1fr)); gap:16px; }
        .kpi-card {
            background:var(--dash-card); border-radius:var(--dash-radius);
            padding:20px 22px 18px; box-shadow:var(--dash-shadow); border:1px solid var(--dash-border);
            position:relative; overflow:hidden; isolation:isolate;
            transition:transform 0.25s cubic-bezier(0.4,0,0.2,1), box-shadow 0.25s;
        }
        .kpi-card::after {
            content:""; position:absolute; right:-34px; bottom:-44px;
            width:140px; height:140px; border-radius:50%; z-index:-1; pointer-events:none;
            background:radial-gradient(circle at center, var(--kc, var(--primary-blue)) 0%, transparent 68%);
            opacity:0.07;
        }
        .kpi-card:hover { transform:translateY(-3px); box-shadow:var(--dash-shadow-lg); }
        .kpi-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
        .kpi-icon {
            width:44px; height:44px; border-radius:13px;
            display:flex; align-items:center; justify-content:center; font-size:1.05rem;
        }
        .kpi-label { font-size:0.76rem; color:var(--dash-text-muted); font-weight:600; letter-spacing:0.04em; }
        .kpi-value {
            font-family:"Poppins",sans-serif; font-weight:800; font-size:2.15rem;
            line-height:1.05; letter-spacing:-0.02em;
            font-variant-numeric:tabular-nums;
        }
        .kpi-sub { font-size:0.73rem; color:var(--dash-text-muted); margin-top:7px; display:flex; align-items:center; gap:5px; }
        .kpi-sub i { font-size:0.65rem; }
        .accent-blue   { --kc:#007bff; } .accent-blue   .kpi-icon { background:rgba(0,123,255,0.10); }
        .accent-purple { --kc:#6f42c1; } .accent-purple .kpi-icon { background:rgba(111,66,193,0.10); }
        .accent-green  { --kc:#16a34a; } .accent-green  .kpi-icon { background:rgba(22,163,74,0.10); }
        .accent-warning{ --kc:#f0a500; } .accent-warning.kpi-icon { background:rgba(240,165,0,0.12); }
        .accent-info   { --kc:#0ea5b7; } .accent-info   .kpi-icon { background:rgba(14,165,183,0.10); }
        .accent-danger { --kc:#ef4444; } .accent-danger .kpi-icon { background:rgba(239,68,68,0.10); }
        .kpi-icon { color:var(--kc, var(--primary-blue)); }
        body.dark-mode .accent-blue   { --kc:#5aa9ff; } body.dark-mode .accent-purple { --kc:#a985ec; }
        body.dark-mode .accent-green  { --kc:#4ade80; } body.dark-mode .accent-warning{ --kc:#fbc245; }
        body.dark-mode .accent-info   { --kc:#38d3e8; } body.dark-mode .accent-danger { --kc:#fb7185; }

        /* ---------- 分项卡片 ---------- */
        .disc-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(235px, 1fr)); gap:16px; }
        .disc-card {
            background:var(--dash-card); border-radius:var(--dash-radius);
            padding:20px; box-shadow:var(--dash-shadow); border:1px solid var(--dash-border);
            position:relative; overflow:hidden;
            transition:transform 0.25s cubic-bezier(0.4,0,0.2,1), box-shadow 0.25s;
        }
        .disc-card::before {
            content:""; position:absolute; top:0; left:0; right:0; height:4px;
            background:linear-gradient(90deg, var(--dc, #007bff), transparent 92%);
        }
        .disc-card:hover { transform:translateY(-3px); box-shadow:var(--dash-shadow-lg); }
        .disc-card.is-empty { opacity:0.62; }
        .disc-head { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
        .disc-glyph {
            width:42px; height:42px; border-radius:12px; flex:none;
            display:flex; align-items:center; justify-content:center;
            font-family:"Poppins",sans-serif; font-weight:800; font-size:0.86rem; color:#fff;
            background:var(--dc, #007bff); box-shadow:0 5px 14px -4px var(--dc, #007bff);
        }
        .disc-name { font-family:"Poppins","Noto Sans SC",sans-serif; font-weight:700; font-size:0.98rem; color:var(--dash-text); line-height:1.25; }
        .disc-name small { font-weight:500; font-size:0.7rem; color:var(--dash-text-muted); display:block; margin-top:2px; font-family:"JetBrains Mono",monospace; }
        .disc-main-val { display:flex; align-items:baseline; gap:7px; margin-bottom:2px; }
        .disc-main-val b { font-family:"Poppins",sans-serif; font-weight:800; font-size:1.72rem; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
        .disc-main-val span { font-size:0.72rem; color:var(--dash-text-muted); }
        .disc-meta-row { display:flex; justify-content:space-between; font-size:0.74rem; color:var(--dash-text-sec); margin-bottom:12px; }
        .disc-meta-row b { font-family:"JetBrains Mono",monospace; color:var(--dash-text); font-weight:600; }
        .disc-share-track { height:6px; border-radius:99px; background:var(--dash-bg-deep); overflow:hidden; }
        body.dark-mode .disc-share-track { background:rgba(255,255,255,0.07); }
        .disc-share-fill {
            height:100%; border-radius:99px; width:0;
            background:var(--dc, #007bff);
            background:linear-gradient(90deg, var(--dc,#007bff), color-mix(in srgb, var(--dc,#007bff) 55%, white));
            transition:width 0.9s cubic-bezier(0.22,1,0.36,1);
        }
        .disc-share-label { display:flex; justify-content:space-between; font-size:0.68rem; color:var(--dash-text-muted); margin-top:6px; }
        .disc-warn { font-size:0.68rem; color:var(--dash-warning); margin-top:9px; text-align:center; background:rgba(240,165,0,0.09); border-radius:8px; padding:4px 6px; }

        /* ---------- 图表面板 ---------- */
        .grid { display:grid; gap:18px; margin-bottom:18px; }
        .grid-2 { grid-template-columns:1fr 1fr; }
        .grid-detail { grid-template-columns:minmax(300px, 420px) 1fr; align-items:start; }
        @media (max-width:1020px){ .grid-2, .grid-detail { grid-template-columns:1fr; } }
        .panel {
            background:var(--dash-card); border-radius:var(--dash-radius);
            box-shadow:var(--dash-shadow); border:1px solid var(--dash-border);
            overflow:hidden;
        }
        .panel-pad { padding:20px 22px; }
        .panel-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:16px 22px; border-bottom:1px solid var(--dash-border); gap:12px;
        }
        .panel-title { font-family:"Poppins","Noto Sans SC",sans-serif; font-weight:700; font-size:0.92rem; color:var(--dash-text); display:flex; align-items:center; gap:9px; }
        .panel-title i { color:var(--primary-blue); font-size:0.88rem; }
        .panel-note { font-size:0.74rem; color:var(--dash-text-muted); font-family:"JetBrains Mono","Noto Sans SC",monospace; }
        .chart-box { height:300px; position:relative; padding:6px 4px 2px; }
        .chart-box.tall { height:340px; }

        /* ---------- 表格 ---------- */
        .table-wrap { overflow-x:auto; }
        .tbl { width:100%; border-collapse:collapse; font-size:0.83rem; }
        .tbl thead th {
            padding:11px 16px; text-align:left; font-weight:600;
            color:var(--dash-text-muted); font-size:0.7rem; white-space:nowrap;
            letter-spacing:0.07em; text-transform:uppercase;
            border-bottom:1px solid var(--dash-border); background:var(--dash-card-2);
            font-family:"Poppins","Noto Sans SC",sans-serif;
        }
        .tbl td { padding:11px 16px; border-bottom:1px solid var(--dash-border); vertical-align:middle; }
        .tbl tbody tr:last-child td { border-bottom:none; }
        .tbl tbody tr { transition:background 0.15s; }
        .tbl tbody tr:hover { background:rgba(0,123,255,0.035); }
        body.dark-mode .tbl tbody tr:hover { background:rgba(90,169,255,0.05); }
        .tbl .num-cell { font-family:"JetBrains Mono",monospace; font-weight:600; text-align:right; color:var(--primary-blue); font-variant-numeric:tabular-nums; }
        .tbl .mono { font-family:"JetBrains Mono",monospace; font-size:0.79rem; }
        .tbl .muted { color:var(--dash-text-muted); }
        .tbl-group td {
            background:var(--dash-card-2); padding:9px 16px !important;
            font-weight:700; font-size:0.8rem; font-family:"Poppins","Noto Sans SC",sans-serif;
            border-bottom:1px solid var(--dash-border);
        }

        /* 状态 pill */
        .pill {
            display:inline-flex; align-items:center; gap:5px;
            padding:3px 10px; border-radius:999px; font-size:0.71rem; font-weight:600; white-space:nowrap;
        }
        .pill i { font-size:0.64rem; }
        .pill-on  { color:var(--dash-success); background:rgba(22,163,74,0.10); }
        .pill-off { color:var(--dash-text-muted); background:rgba(138,151,171,0.14); }

        /* 占比条（表格内） */
        .mini-bar { height:6px; border-radius:99px; background:var(--dash-bg-deep); overflow:hidden; min-width:90px; }
        body.dark-mode .mini-bar { background:rgba(255,255,255,0.07); }
        .mini-bar-fill { height:100%; border-radius:99px; animation:growBar 0.9s cubic-bezier(0.22,1,0.36,1) both; transform-origin:left; }
        @keyframes growBar { from { transform:scaleX(0); } to { transform:scaleX(1); } }

        .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; vertical-align:0; }

        /* ---------- 核心数据文件卡片 ---------- */
        .file-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:14px; }
        .file-card {
            background:var(--dash-card); border-radius:var(--dash-radius);
            padding:16px 18px 14px; box-shadow:var(--dash-shadow); border:1px solid var(--dash-border);
            position:relative; overflow:hidden;
            transition:transform 0.25s cubic-bezier(0.4,0,0.2,1), box-shadow 0.25s;
        }
        .file-card::before {
            content:""; position:absolute; top:0; left:0; right:0; height:3px;
            background:linear-gradient(90deg, var(--fc, #007bff), transparent 92%);
        }
        .file-card:hover { transform:translateY(-3px); box-shadow:var(--dash-shadow-lg); }
        .f-blue   { --fc:#007bff; } .f-purple { --fc:#6f42c1; } .f-green  { --fc:#16a34a; }
        .f-warning{ --fc:#e8940a; } .f-info   { --fc:#0ea5b7; } .f-danger { --fc:#ef4444; }
        body.dark-mode .f-blue    { --fc:#5aa9ff; } body.dark-mode .f-purple  { --fc:#a985ec; }
        body.dark-mode .f-green   { --fc:#4ade80; } body.dark-mode .f-warning { --fc:#fbc245; }
        body.dark-mode .f-info    { --fc:#38d3e8; } body.dark-mode .f-danger  { --fc:#fb7185; }
        .file-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; min-width:0; }
        .file-icon {
            width:34px; height:34px; border-radius:9px; flex:none;
            display:flex; align-items:center; justify-content:center; font-size:0.82rem;
            background:var(--fc, #007bff); color:#fff;
            background:color-mix(in srgb, var(--fc, #007bff) 13%, transparent);
            color:var(--fc, #007bff);
        }
        .file-name {
            font-family:"JetBrains Mono",monospace; font-size:0.78rem; font-weight:600;
            color:var(--dash-text-sec); word-break:break-all; line-height:1.35;
        }
        .file-val {
            font-family:"Poppins","Noto Sans SC",sans-serif; font-weight:800; font-size:1.55rem;
            letter-spacing:-0.02em; color:var(--dash-text);
            display:flex; align-items:baseline; gap:8px; margin-bottom:10px;
            font-variant-numeric:tabular-nums;
        }
        .file-unit {
            font-size:0.7rem; font-weight:400; color:var(--dash-text-muted); letter-spacing:0;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
        }
        .file-date { font-size:0.95rem; color:var(--dash-text-sec); }
        .file-foot {
            display:flex; align-items:center; justify-content:space-between; gap:8px;
            margin-top:10px; min-height:20px; font-size:0.68rem; color:var(--dash-text-muted);
        }
        .pill-warn { color:var(--dash-warning); background:rgba(240,165,0,0.12); }

        /* ---------- TOP 选手排行 ---------- */
        .rank-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px dashed var(--dash-border); }
        .rank-row:last-child { border-bottom:none; }
        .rank-no {
            width:26px; height:26px; border-radius:8px; flex:none;
            display:flex; align-items:center; justify-content:center;
            font-family:"Poppins",sans-serif; font-weight:700; font-size:0.72rem;
            background:var(--dash-bg-deep); color:var(--dash-text-muted);
        }
        .rank-no.r1 { background:linear-gradient(135deg,#ffd54d,#f0a500); color:#fff; box-shadow:0 3px 8px -2px rgba(240,165,0,0.55); }
        .rank-no.r2 { background:linear-gradient(135deg,#e8edf4,#b8c4d4); color:#fff; }
        .rank-no.r3 { background:linear-gradient(135deg,#eda77f,#cd7f32); color:#fff; }
        .rank-body { flex:1; min-width:0; }
        .rank-name { font-size:0.82rem; font-weight:600; color:var(--dash-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .rank-track { height:5px; border-radius:99px; background:var(--dash-bg-deep); margin-top:6px; overflow:hidden; }
        body.dark-mode .rank-track { background:rgba(255,255,255,0.07); }
        .rank-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--primary-blue),#6f42c1); animation:growBar 0.9s cubic-bezier(0.22,1,0.36,1) both; transform-origin:left; }
        .rank-val { font-family:"JetBrains Mono",monospace; font-size:0.78rem; font-weight:600; color:var(--primary-blue); white-space:nowrap; }
        .rank-sub { font-size:0.66rem; color:var(--dash-text-muted); margin-top:2px; }

        /* ---------- 加载 / 空状态 ---------- */
        .loading-view { text-align:center; padding:110px 20px; color:var(--dash-text-muted); }
        .loading-ring {
            width:52px; height:52px; margin:0 auto 20px; border-radius:50%;
            border:3px solid var(--dash-border); border-top-color:var(--primary-blue);
            animation:spin 0.85s linear infinite;
        }
        .loading-view p { font-size:0.86rem; letter-spacing:0.02em; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .empty-cell { text-align:center; padding:30px !important; color:var(--dash-text-muted); font-size:0.82rem; }

        .fade-in { animation:fadeInUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

        /* ---------- 响应式 ---------- */
        @media (max-width:768px) {
            .dash-main { padding:20px 12px 40px; }
            .kpi-grid { grid-template-columns:repeat(2, 1fr); gap:12px; }
            .kpi-card { padding:16px; }
            .kpi-value { font-size:1.6rem; }
            .disc-grid { grid-template-columns:1fr; }
            .file-grid { grid-template-columns:repeat(2, 1fr); gap:10px; }
            .file-card { padding:13px 14px; }
            .file-val { font-size:1.15rem; flex-wrap:wrap; }
            .file-unit { display:none; }
            .btn-back-label { display:none; }
            .hero-chips { display:none; }
            .chart-box.tall { height:280px; }
        }
    </style>
</head>
<body class="admin-page">
<noscript><div style="padding:10px;text-align:center;background:#b91c1c;color:#fff;font-size:0.9rem;">本站需要启用 JavaScript 才能加载排名与内容数据。This site requires JavaScript to load data.</div></noscript>
    <main class="dash-main" id="dashMain">
        <header class="page-head fade-in">
            <div class="page-head-left">
                <a href="index.html" class="logo-badge" title="返回首页">
                    <i class="fa-solid fa-table-tennis-paddle-ball"></i>
                </a>
                <div class="ph-titles">
                    <h1><span class="h1-dot"></span>数据仪表盘</h1>
                    <p class="hero-desc">全站数据资产一览 · WTT 五项模块与核心数据实时统计</p>
                </div>
            </div>
            <div class="ph-actions">
                <button class="dash-btn icon-only" id="themeToggle" title="切换主题" aria-label="切换主题">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <a href="draws-editor.html" class="dash-btn primary" title="可视化编辑对阵表并导出 draws.json">
                    <i class="fa-solid fa-diagram-project"></i>对阵表编辑器
                </a>
                <button class="dash-btn primary" id="refreshBtn" title="重新加载全站数据">
                    <i class="fa-solid fa-rotate"></i>刷新
                </button>
                <a href="index.html" class="dash-btn icon-only" title="返回首页" aria-label="返回首页">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
        </header>

        <div class="hero-chips" id="heroChips" aria-live="polite"></div>

        <!-- ===== Web 记分录入工具（生成 score-log.json 片段 / 合并导出）===== -->
        <section id="scoreEntry" style="max-width:1100px;margin:18px auto 0;padding:0 20px;">
            <style>
                #scoreEntry .se-card { background:var(--card-bg,#fff); border:1px solid var(--border-color,#e3e8ef); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
                #scoreEntry h2 { font-size:1.05rem; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
                #scoreEntry .se-row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
                #scoreEntry label { font-size:.78rem; color:var(--text-secondary,#667); display:block; margin-bottom:3px; }
                #scoreEntry select, #scoreEntry input { padding:7px 9px; border:1px solid var(--border-color,#ccd); border-radius:8px; background:var(--bg-color,#fff); color:var(--text-primary,#223); font-size:.85rem; }
                #scoreEntry button { cursor:pointer; border:none; border-radius:8px; padding:8px 14px; font-size:.82rem; font-weight:600; }
                #scoreEntry .se-add { background:var(--primary-blue,#007bff); color:#fff; }
                #scoreEntry .se-mode { background:transparent; color:var(--text-secondary,#667); border:1px solid var(--border-color,#ccd); }
                #scoreEntry .se-mode.active { background:#17a2b8; color:#fff; border-color:#17a2b8; }
                #scoreEntry .se-export { background:#28a745; color:#fff; }
                #scoreEntry .se-copy { background:#6c757d; color:#fff; }
                #scoreEntry .se-clear { background:#dc3545; color:#fff; }
                #scoreEntry .se-list { list-style:none; margin:10px 0 0; padding:0; font-size:.82rem; }
                #scoreEntry .se-list li { padding:5px 8px; border-bottom:1px dashed var(--border-color,#eef); display:flex; justify-content:space-between; gap:8px; }
                #scoreEntry .se-msg { font-size:.78rem; margin-top:8px; min-height:1em; }
                #scoreEntry .se-msg.err { color:#dc3545; } #scoreEntry .se-msg.ok { color:#28a745; }
            </style>
            <div class="se-card">
                <h2><i class="fa-solid fa-pen-to-square"></i> 记分录入</h2>
                <div class="se-row" style="margin-bottom:10px;">
                    <button type="button" class="se-mode active" id="seModeMatch"><i class="fa-solid fa-table-tennis-paddle-ball"></i> 比赛结果</button>
                    <button type="button" class="se-mode" id="seModeBonus"><i class="fa-solid fa-plus-minus"></i> 积分调整</button>
                </div>
                <div class="se-row" id="seMatchRow">
                    <div><label>日期</label><input type="date" id="seDate"></div>
                    <div><label>类型</label><select id="seType"></select></div>
                    <div><label>赛制</label><select id="seFormat">
                        <option value="default">default</option>
                        <option value="bo3">bo3</option>
                        <option value="bo5">bo5</option>
                        <option value="bo7">bo7</option>
                    </select></div>
                    <div><label>胜者</label><select id="seWinner"></select></div>
                    <div><label>负者</label><select id="seLoser"></select></div>
                    <button type="button" class="se-add" id="seAddMatch">添加记录</button>
                </div>
                <div class="se-row" id="seBonusRow" style="display:none;">
                    <div><label>日期</label><input type="date" id="seBDate"></div>
                    <div><label>对象</label><select id="seTarget"></select></div>
                    <div><label>分数（如 +100 / -30）</label><input type="text" id="seAmount" size="8" placeholder="+100"></div>
                    <button type="button" class="se-add" id="seAddBonus">添加调整</button>
                </div>
                <div class="se-msg" id="seMsg"></div>
                <ul class="se-list" id="seQueue"></ul>
                <div class="se-row" style="margin-top:12px;" id="seActions" hidden>
                    <button type="button" class="se-copy" id="seCopy"><i class="fa-solid fa-clipboard"></i> 复制 JSON</button>
                    <button type="button" class="se-export" id="seExport"><i class="fa-solid fa-download"></i> 下载合并后的 score-log.json</button>
                    <button type="button" class="se-clear" id="seClear">清空队列</button>
                </div>
            </div>
        </section>
        <script>
        (function () {
            var $ = function (id) { return document.getElementById(id); };
            var TYPES_URL = "data/event-coefficient.json", PLAYERS_URL = "data/players.json", LOG_URL = "data/score-log.json";
            var mode = "match", queue = [], players = [];
            function msg(text, isErr) { var el = $("seMsg"); el.textContent = text; el.className = "se-msg " + (isErr ? "err" : "ok"); }
            function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
            function fillSelect(sel, arr, placeholder) { sel.innerHTML = '<option value="">' + placeholder + "</option>" + arr.map(function (n) { return '<option value="' + n.replace(/&/g, "&amp;").replace(/"/g, "&quot;") + '">' + n.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</option>"; }).join(""); }
            function renderQueue() {
                $("seQueue").innerHTML = queue.map(function (q, i) {
                    var txt = q["胜者"] ? (q["日期"] + " · " + q["类型"] + " · 赛制 " + (q["赛制"] || "default") + " · " + q["胜者"] + " 胜 " + q["负者"]) : (q["日期"] + " · 调整 · " + q["对象"] + " " + q["分数"]);
                    return "<li><span>" + txt + '</span><span><a href="#" data-i="' + i + '" style="color:#dc3545;">移除</a></span></li>';
                }).join("");
                $("seActions").hidden = !queue.length;
                $("seQueue").querySelectorAll("a[data-i]").forEach(function (a) {
                    a.addEventListener("click", function (e) { e.preventDefault(); queue.splice(+a.dataset.i, 1); renderQueue(); });
                });
            }
            fetch(TYPES_URL).then(function (r) { return r.json(); }).then(function (t) {
                $("seType").innerHTML = Object.keys(t).filter(function (k) { return typeof t[k] === "number"; }).map(function (k) { return '<option value="' + k + '">' + k + "</option>"; }).join("");
            }).catch(function () { msg("赛事系数加载失败", true); });
            fetch(PLAYERS_URL).then(function (r) { return r.json(); }).then(function (p) {
                players = ((p && p.players) || []).filter(function (x) { return x.name; }).map(function (x) { return x.name; });
                fillSelect($("seWinner"), players, "-- 选择胜者 --");
                fillSelect($("seLoser"), players, "-- 选择负者 --");
                fillSelect($("seTarget"), players, "-- 选择球员 --");
            }).catch(function () { msg("players.json 加载失败", true); });
            ["seDate", "seBDate"].forEach(function (id) { $(id).value = todayStr(); });
            $("seModeMatch").addEventListener("click", function () { mode = "match"; this.classList.add("active"); $("seModeBonus").classList.remove("active"); $("seMatchRow").style.display = ""; $("seBonusRow").style.display = "none"; });
            $("seModeBonus").addEventListener("click", function () { mode = "bonus"; this.classList.add("active"); $("seModeMatch").classList.remove("active"); $("seBonusRow").style.display = ""; $("seMatchRow").style.display = "none"; });
            $("seAddMatch").addEventListener("click", function () {
                var fmt = $("seFormat").value;
                if (["default", "bo3", "bo5", "bo7"].indexOf(fmt) === -1) return msg("赛制仅支持 default / bo3 / bo5 / bo7", true);
                var rec = { "日期": $("seDate").value, "类型": $("seType").value, "赛制": fmt, "胜者": $("seWinner").value, "负者": $("seLoser").value };
                if (!rec["日期"] || !rec["类型"] || !rec["胜者"] || !rec["负者"]) return msg("请完整填写日期 / 类型 / 胜者 / 负者", true);
                if (rec["胜者"] === rec["负者"]) return msg("胜者与负者不能相同", true);
                if (!/^\d{4}-\d{2}-\d{2}$/.test(rec["日期"])) return msg("日期格式需为 YYYY-MM-DD", true);
                queue.push(rec); renderQueue(); msg("已添加 1 条比赛记录", false);
            });
            $("seAddBonus").addEventListener("click", function () {
                var amt = $("seAmount").value.trim();
                var num = parseFloat(amt);
                var rec = { "日期": $("seBDate").value, "类型": "比赛结果加分", "对象": $("seTarget").value, "分数": /^[+-]?\d+(\.\d+)?$/.test(amt) ? (num > 0 ? "+" + num : String(num)) : amt };
                if (!rec["日期"] || !rec["对象"] || !amt || isNaN(num)) return msg("请完整填写日期 / 对象 / 分数（数字）", true);
                queue.push(rec); renderQueue(); $("seAmount").value = ""; msg("已添加 1 条积分调整", false);
            });
            $("seClear").addEventListener("click", function () { queue = []; renderQueue(); msg("队列已清空", false); });
            $("seCopy").addEventListener("click", function () {
                var json = JSON.stringify(queue, null, 2).split("\n").map(function (l) { return "  " + l; }).join("\n");
                navigator.clipboard.writeText(json).then(function () { msg("已复制到剪贴板，可粘贴进 data/score-log.json 数组末尾", false); }, function () { msg("复制失败，请手动选择文本", true); });
            });
            $("seExport").addEventListener("click", function () {
                fetch(LOG_URL).then(function (r) { return r.json(); }).then(function (log) {
                    var merged = log.concat(queue);
                    var blob = new Blob([JSON.stringify(merged, null, 2) + "\n"], { type: "application/json" });
                    var a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = "score-log.json";
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
                    msg("已下载合并文件（原 " + log.length + " 条 + 新增 " + queue.length + " 条）。请用下载的文件替换 data/score-log.json 并提交。", false);
                }).catch(function () { msg("当前 score-log.json 加载失败，无法合并导出", true); });
            });
        })();
        </script>

        <div class="loading-view" id="loadingView">
            <div class="loading-ring"></div>
            <p>正在加载全站数据...</p>
        </div>
        <div id="dashboardContent" style="display:none;"></div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
