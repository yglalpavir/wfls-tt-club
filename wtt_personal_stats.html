<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/svg+xml" href="Assets/files/favicon_4DA3FF.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>(function(){try{var t=localStorage.getItem("wfls-tt-theme");var d=t==="dark"||(!t&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.classList.add("dark-mode");}catch(e){}})()</script>
    <meta name="description" content="WTT 国际乒联积分排名 · 个人数据 · 对手分析">
    <meta name="keywords" content="WTT,世界乒联,乒乓球,个人数据,球员数据,战绩分析">
    <meta name="robots" content="noindex, nofollow">
    <title>WTT 个人数据 🥚 | WFLS Table Tennis Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.5.0/css/flag-icons.min.css" integrity="sha384-8olrmTcwXL3OYMeB+2ok8jx9/U/FZxeLnoRWdu1Pyi+lakrkqoI7hfysfQF5Q1Xx" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><div style="padding:10px;text-align:center;background:#b91c1c;color:#fff;font-size:0.9rem;">本站需要启用 JavaScript 才能加载排名与内容数据。This site requires JavaScript to load data.</div></noscript>
    <script src="js/shared-partials.js" data-partial="nav"></script>

    <section class="page-hero wtt-ranking-hero">
        <div class="page-hero-overlay"></div>
        <div class="page-hero-content">
            <span class="section-tag wtt-easter-egg-tag">🥚 Easter Egg</span>
            <h1>WTT <span id="wttCatName">个人数据</span></h1>
            <p data-i18n="wtt_ps_hero_title">WTT 个人比赛数据统计</p>
        </div>
    </section>

    <section class="section personal-stats-main-section">
        <div class="container">
            <div class="viz-section-header">
                <span class="section-tag">Personal Stats</span>
                <h2 class="section-title" data-i18n="wtt_ps_title">WTT 个人数据</h2>
            </div>
            <div class="viz-personal-grid">
                <div class="viz-personal-selector glass-card">
                    <div class="compare-selector-group">
                        <label data-i18n="wtt_ps_label">选择球员</label>
                        <div class="player-search-container" id="wttPersonalPlayerSearchContainer">
                            <div class="player-search-input-wrapper">
                                <i class="fa-solid fa-magnifying-glass player-search-icon"></i>
                                <input type="text" id="wttPersonalPlayerSearch" class="player-search-input" placeholder="搜索球员名称..." autocomplete="off">
                                <button class="player-search-clear" id="wttPersonalPlayerSearchClear" style="display:none;">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <div class="player-search-dropdown" id="wttPersonalPlayerDropdown">
                                <div class="player-search-list" id="wttPersonalPlayerList"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="viz-personal-result glass-card" id="wttPersonalResult">
                    <div class="compare-placeholder">
                        <i class="fa-solid fa-user-chart"></i>
                        <p data-i18n="wtt_ps_placeholder">选择一名球员查看个人数据</p>
                    </div>
                </div>
            </div>

            <div class="wtt-back-link" style="text-align:center;margin-top:40px;">
                <a href="wtt_hub.html" class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-arrow-left"></i> <span data-i18n="wtt_back_hub">返回 WTT Hub</span>
                </a>
            </div>
        </div>
    </section>

    <script src="js/shared-partials.js" data-partial="footer"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
    <script src="js/common.js"></script>
    <script src="js/score-engine.js"></script>
    <script src="js/wtt_common.js"></script>
    <script src="js/wtt_personal_stats.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
