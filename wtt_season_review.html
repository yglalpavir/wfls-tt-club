    <link rel="stylesheet" href="style.css">
    <style>
        .sr-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:14px 18px; margin-bottom:18px; }
        .sr-toolbar label { font-size:.85rem; color:var(--text-secondary); white-space:nowrap; }
        .sr-toolbar select { padding:8px 12px; border:1px solid var(--border-color); border-radius:8px; background:var(--bg-color,var(--card-bg)); color:var(--text-primary); font-size:.88rem; }
        .sr-season-meta { font-size:.82rem; color:var(--text-tertiary); }
        .sr-ongoing-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:.72rem; font-weight:600; color:#16a34a; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.35); }
        .sr-kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:16px; }
        .sr-kpi { padding:16px 18px; display:flex; align-items:center; gap:14px; }
        .sr-kpi i { font-size:1.4rem; color:var(--accent-blue,#3b82f6); width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:12px; background:rgba(59,130,246,.1); flex:none; }
        .sr-kpi-value { font-size:1.35rem; font-weight:700; color:var(--text-primary); line-height:1.2; }
        .sr-kpi-label { font-size:.78rem; color:var(--text-secondary); }
        .sr-types { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
        .sr-type-badge { padding:4px 12px; border-radius:999px; font-size:.78rem; color:var(--text-secondary); background:var(--card-bg); border:1px solid var(--border-color); }
        .sr-type-badge strong { color:var(--text-primary); }
        .sr-grid-2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; margin-bottom:16px; }
        .sr-card { padding:18px 20px; margin-bottom:16px; }
        .sr-grid-2 .sr-card { margin-bottom:0; }
        .sr-card-header { display:flex; align-items:baseline; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
        .sr-card-header h3 { margin:0; font-size:1rem; color:var(--text-primary); }
        .sr-card-header i { color:var(--accent-blue,#3b82f6); margin-right:4px; }
        .sr-card-desc { font-size:.78rem; color:var(--text-tertiary); margin:0 0 12px; }
        .sr-scroll { max-height:360px; overflow:auto; }
        .sr-placeholder { text-align:center; padding:26px 10px; color:var(--text-tertiary); font-size:.85rem; }
        .sr-best-line { display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding:8px 0; font-size:.92rem; }
        .sr-best-score { font-size:1.6rem; font-weight:700; color:var(--accent-gold,#f0a500); }
        .sr-best-meta { color:var(--text-secondary); font-size:.82rem; }
        .sr-games-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:12px; }
        .sr-game-stat { padding:10px 12px; border:1px solid var(--border-color); border-radius:10px; text-align:center; }
        .sr-game-stat b { display:block; font-size:1.2rem; color:var(--text-primary); }
        .sr-game-stat span { font-size:.74rem; color:var(--text-tertiary); }
        .sr-bonus-summary { font-size:.84rem; color:var(--text-secondary); margin-bottom:10px; }
        .sr-delta-pos { color:#16a34a; font-weight:600; }
        .sr-delta-neg { color:#dc2626; font-weight:600; }
        .sr-chart-box { position:relative; height:300px; margin-top:12px; }
        .sr-daily-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; }
        .sr-daily-search { padding:7px 12px; border:1px solid var(--border-color); border-radius:8px; background:var(--bg-color,var(--card-bg)); color:var(--text-primary); font-size:.85rem; min-width:180px; }
        .sr-daily-search:focus { outline:none; border-color:var(--accent-blue,#3b82f6); }
        .sr-daily-clear { padding:7px 14px; border:1px solid var(--border-color); border-radius:8px; background:transparent; color:var(--text-secondary); font-size:.8rem; cursor:pointer; }
        .sr-daily-clear:hover { color:var(--text-primary); border-color:var(--accent-blue,#3b82f6); }
        .sr-daily-count { margin-left:auto; font-size:.78rem; font-weight:600; color:var(--text-tertiary); }
        .sr-daily-chips { display:flex; flex-wrap:wrap; gap:8px; max-height:136px; overflow:auto; padding:2px; margin-bottom:10px; }
        .sr-chip { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; border:1px solid var(--border-color); background:var(--bg-color,var(--card-bg)); color:var(--text-secondary); font-size:.8rem; cursor:pointer; user-select:none; transition:border-color .15s ease, background .15s ease, color .15s ease; }
        .sr-chip:hover { border-color:var(--accent-blue,#3b82f6); color:var(--text-primary); }
        .sr-chip-dot { width:8px; height:8px; border-radius:50%; background:transparent; flex:none; }
        .sr-daily-hint { font-size:.78rem; color:#dc2626; margin:0 0 10px; }
        .wtt-easter-egg-note { font-size:.78rem; color:var(--text-tertiary); text-align:center; margin-top:28px; }
        @media (max-width:640px) { .sr-kpi-row { grid-template-columns:repeat(2,1fr); } .sr-chart-box { height:260px; } }
    </style>
</head>
