<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title data-i18n="g_tr_title">乒乓·训练控制台 — Web UI 可视化训练</title>
<link rel="stylesheet" href="css/train.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* CDN 容错：cdnjs 主源不可达时同步回退 jsdelivr（document.write 在解析期执行，
   保证 train-ui.js 加载时 Chart 已就绪，不会误判为离线）。 */
if(typeof Chart === 'undefined'){
  document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"><\/script>');
}
</script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <b data-i18n="g_tr_brand">乒乓·训练控制台</b>
      <span>TT ARENA / TRAIN LAB</span>
    </div>
    <span class="dot" id="srvDot"></span><span class="hint" id="srvHint" data-i18n="g_tr_connecting">连接中…</span>
    <div class="spacer"></div>
    <span class="hint" id="nodeHint"></span>
    <button class="btn ghost" id="btnRefresh"><span data-i18n="g_tr_refresh">↻ 刷新</span></button>
    <button class="btn ghost" id="gameLangToggle"><span data-i18n="g_lang_btn">EN</span></button>
    <a class="btn ghost" href="/"><span data-i18n="g_tr_back_game">← 返回游戏</span></a>
  </header>

  <div class="banner" id="banner"></div>

  <section class="cards" id="cards"></section>

  <main class="workspace">

    <aside class="panel">
      <div class="hd"><span id="cfgTitle" data-i18n="g_tr_config">配置</span><span class="tag" id="cfgScript"></span></div>
      <div class="body" id="cfgBody">
        <div class="sec-t" data-i18n="g_tr_presets">预设</div>
        <div class="presets" id="presets"></div>

        <label class="chk" style="margin-bottom:10px">
          <input type="checkbox" id="chkDry" checked>
          <span data-i18n="g_tr_dry_hint">实验模式 · 不覆盖生产权重</span>
          <span class="k">dryRun</span>
        </label>

        <div class="sec-t" data-i18n="g_tr_params">参数</div>
        <div class="fields" id="fields"></div>

        <div class="divider"></div>
        <div class="sec-t" data-i18n="g_tr_flags">开关</div>
        <div class="chks" id="flags"></div>

        <div class="divider"></div>
        <div class="sec-t" data-i18n="g_tr_extra_cmd">额外命令行</div>
        <div class="rawrow">
          <input id="rawArgs" type="text" placeholder="--extra --flags" spellcheck="false">
          <button class="btn sm" id="btnApplyRaw" data-i18n="g_tr_apply">应用</button>
        </div>

        <div class="cmdbox" id="cmdbox" data-i18n="g_tr_no_cmd">尚未生成命令</div>
        <div class="warn ok" id="warnBox" data-i18n="g_tr_warn_init"><b>实验模式</b>：不覆盖生产权重</div>
      </div>
      <div class="runbar">
        <button class="btn go" id="btnRun"><span data-i18n="g_tr_btn_run">▶ 启动训练</span></button>
        <button class="btn stop" id="btnStop" disabled><span data-i18n="g_tr_btn_stop">■ 停止</span></button>
        <span class="status"><span class="dot" id="runDot"></span><span id="runStatus" data-i18n="g_tr_idle">空闲</span></span>
      </div>
    </aside>

    <section class="stage">

      <div class="panel matrixbox">
        <div class="hd">
          <span data-i18n="g_tr_matrix_title">验证胜率 · 每轮全阶梯</span>
          <span class="tag" id="mxTag">—</span>
          <span class="spacer" style="flex:1"></span>
          <span class="tag" id="mxMeter">—</span>
          <div class="meter"><div class="bar" id="mxBar"></div></div>
        </div>
        <div class="mxgrid" id="mxGrid"></div>
      </div>

      <div class="panel chartbox">
        <div class="hd">
          <span id="chartTitle" data-i18n="g_tr_chart_title">训练曲线</span>
          <span class="tag" id="chartTag"></span>
          <span class="spacer" style="flex:1"></span>
          <label class="chk" style="font-size:11px"><input type="checkbox" id="chkNorm"><span data-i18n="g_tr_norm">x 轴归一化</span></label>
        </div>
        <div class="chartwrap"><canvas id="chart"></canvas></div>
        <div class="legend" id="legend"></div>
        <div class="readout" id="readout"></div>
      </div>

      <div class="panel tabs">
        <div class="tabbar">
          <button data-tab="log" class="on" data-i18n="g_tr_tab_log">实时日志</button>
          <button data-tab="ckpt" data-i18n="g_tr_tab_ckpt">检查点 · 续训</button>
          <button data-tab="runs" data-i18n="g_tr_tab_runs">运行历史</button>
          <button data-tab="curves" data-i18n="g_tr_tab_curves">曲线历史</button>
          <button data-tab="logs" data-i18n="g_tr_tab_logs">训练日志文件</button>
          <div class="side">
            <label class="chk" style="font-size:11px"><input type="checkbox" id="chkAuto" checked><span data-i18n="g_tr_autoscroll">自动滚动</span></label>
            <button class="btn sm ghost" id="btnClear" data-i18n="g_tr_clear">清空</button>
          </div>
        </div>

        <div class="tabpane on" id="tab-log">
          <div class="logbox" id="logbox"></div>
        </div>

        <div class="tabpane" id="tab-ckpt">
          <div class="cktop">
            <label for="ckRun" data-i18n="g_tr_batch">训练批次</label>
            <select id="ckRun"></select>
            <span class="spacer" style="flex:1"></span>
            <span class="tag" id="ckMeta" style="font-family:var(--mono);font-size:10px;color:var(--dimtx);text-transform:none;letter-spacing:0">—</span>
            <button class="btn sm ghost" id="btnCkRefresh"><span>↻</span></button>
          </div>
          <div class="panescroll ckwrap">
            <table id="ckptTable">
              <thead><tr id="ckHead"></tr></thead>
              <tbody></tbody>
            </table>
            <div class="empty" id="ckptEmpty" style="display:none" data-i18n="g_tr_ckpt_empty">data/checkpoints/ 下没有检查点 · 启动一次带 --run-name 的训练后这里会出现批次</div>
          </div>
        </div>

        <div class="tabpane" id="tab-runs">
          <div class="panescroll">
            <table id="runsTable">
              <thead><tr>
                <th data-i18n="g_tr_th_time">时间</th><th data-i18n="g_tr_th_model">模型</th><th data-i18n="g_tr_th_cmd">命令</th><th data-i18n="g_tr_th_status">状态</th><th data-i18n="g_tr_th_dur">时长</th>
                <th data-i18n="g_tr_th_points">点数</th><th data-i18n="g_tr_best">最佳</th><th data-i18n="g_tr_th_result">结果</th>
              </tr></thead>
              <tbody></tbody>
            </table>
            <div class="empty" id="runsEmpty" style="display:none" data-i18n="g_tr_runs_empty">暂无运行记录</div>
          </div>
        </div>

        <div class="tabpane" id="tab-curves">
          <div class="panescroll">
            <table id="curvesTable">
              <thead><tr>
                <th data-i18n="g_tr_file">文件</th><th data-i18n="g_tr_th_model">模型</th><th data-i18n="g_tr_th_points">点数</th><th data-i18n="g_tr_th_size">大小</th><th data-i18n="g_tr_th_mtime">修改时间</th>
              </tr></thead>
              <tbody></tbody>
            </table>
            <div class="empty" id="curvesEmpty" style="display:none" data-i18n="g_tr_curves_empty">未发现曲线文件</div>
          </div>
        </div>

        <div class="tabpane" id="tab-logs">
          <div class="panescroll">
            <table id="logsTable">
              <thead><tr><th data-i18n="g_tr_file">文件</th><th data-i18n="g_tr_th_size">大小</th><th data-i18n="g_tr_th_mtime">修改时间</th><th data-i18n="g_tr_th_preview">预览</th></tr></thead>
              <tbody></tbody>
            </table>
            <div class="empty" id="logsEmpty" style="display:none" data-i18n="g_tr_logs_empty">根目录没有 .log / .err 文件</div>
            <div class="logbox" id="logFileView" style="display:none; margin-top:8px; max-height:260px"></div>
          </div>
        </div>

      </div>
    </section>
  </main>
</div>

<script src="js/i18n.js"></script>
<script src="js/train-ui.js"></script>
</body>
</html>
